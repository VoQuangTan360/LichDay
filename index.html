function clamp(v, lo, hi) {
  return Math.max(lo, Math.min(hi, v));
}
function dateKey(date) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, "0");
  const d = String(date.getDate()).padStart(2, "0");
  return `${y}-${m}-${d}`;
}
function currentMonthKey() {
  return dateKey(new Date()).slice(0, 7);
}
function startOfWeek(date) {
  const result = new Date(date);
  const dayIndex = (result.getDay() + 6) % 7;
  result.setHours(0, 0, 0, 0);
  result.setDate(result.getDate() - dayIndex);
  return result;
}
function weekKeyForDateString(value) {
  return dateKey(startOfWeek(new Date(`${value}T00:00:00`)));
}

function pricingForStudent(session, student) {
  const legacyRate = Number(session.studentRates?.[student?.id] ?? student?.hourlyRate) || 0;
  const pricing = session.studentPricing?.[student?.id] || { mode: "hourly", amount: legacyRate };
  return { mode: pricing.mode === "fixed" ? "fixed" : "hourly", amount: Math.max(0, Number(pricing.amount) || 0) };
}

function calculatedLessonFee(session, student) {
  const pricing = pricingForStudent(session, student);
  return pricing.mode === "fixed" ? pricing.amount : (session.duration / 60) * pricing.amount;
}

function lessonRecordFromTemplate(key, session, student, status) {
  const lessonDate = key.split("|")[0];
  const pricing = pricingForStudent(session, student);
  const unitPrice = pricing.amount;
  const calculatedAmount = calculatedLessonFee(session, student);
  return {
    key,
    date: lessonDate,
    sessionId: session.id,
    studentId: student?.id || session.studentId,
    studentName: student?.name || "?",
    start: session.start,
    duration: session.duration,
    note: session.note || "",
    details: session.details || "",
    pricingMode: pricing.mode === "fixed" ? "fixed" : "hourly",
    unitPrice,
    hourlyRate: unitPrice,
    amount: status === "completed" ? calculatedAmount : 0,
    status,
  };
}

function normalizeSession(session, students) {
  const studentIds = Array.isArray(session.studentIds) && session.studentIds.length
    ? session.studentIds
    : session.studentId
    ? [session.studentId]
    : [];
  const studentRates = { ...(session.studentRates || {}) };
  const studentPricing = { ...(session.studentPricing || {}) };
  studentIds.forEach((studentId) => {
    if (studentRates[studentId] == null) {
      studentRates[studentId] = Number((students || []).find((student) => student.id === studentId)?.hourlyRate) || 0;
    }
    if (!studentPricing[studentId]) studentPricing[studentId] = { mode: "hourly", amount: Number(studentRates[studentId]) || 0 };
  });
  return { effectiveFrom: "1970-01-01", details: "", ...session, studentId: studentIds[0] || null, studentIds, studentRates, studentPricing };
}

function normalizeLessonRecords(records) {
  const normalized = {};
  Object.values(records || {}).forEach((record) => {
    if (!record || !record.studentId || !record.key) return;
    const parts = record.key.split("|");
    const key = parts.length >= 3 ? record.key : `${record.key}|${record.studentId}`;
    normalized[key] = {
      pricingMode: "hourly",
      unitPrice: Number(record.hourlyRate) || 0,
      details: "",
      ...record,
      key,
    };
  });
  return normalized;
}

function migrateLegacyAttendance(attendance, sessions, students) {
  const records = {};
  Object.entries(attendance || {}).forEach(([key, status]) => {
    if (status === "planned") return;
    const sessionId = key.split("|")[1];
    const session = (sessions || []).find((item) => item.id === sessionId);
    if (!session) return;
    const student = (students || []).find((item) => item.id === session.studentId);
    const studentKey = `${key}|${session.studentId}`;
    records[studentKey] = lessonRecordFromTemplate(studentKey, normalizeSession(session, students), student, status);
  });
  return records;
}

// ---------- Cloud sync (optional, via the user's own Firebase project) ----------
const SYNC_CFG_KEY = "tutor_schedule_sync_cfg";
const FIREBASE_PERSISTENCE_APPS = new Set();
function loadSyncCfg() {
  try {
    const raw = localStorage.getItem(SYNC_CFG_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return null;
}
function readSyncCfgFromHash() {
  const h = window.location.hash;
  if (!h.startsWith("#sync=")) return null;
  try {
    const json = decodeURIComponent(escape(atob(h.slice(6))));
    const parsed = JSON.parse(json);
    if (parsed && parsed.apiKey && parsed.projectId && parsed.syncCode) return parsed;
  } catch (e) {}
  return null;
}
function randomSyncCode() {
  return Math.random().toString(36).slice(2, 8) + Math.random().toString(36).slice(2, 6);
}

  const gridRef = useRef(null);

  // Refresh records only after an explicit class/student edit. Merely reopening a

  useEffect(() => {
    const editedIds = recordsRefreshSessionIdsRef.current;
    if (!editedIds.size) return;
    recordsRefreshSessionIdsRef.current = new Set();
    setLessonRecords((previous) => {
      let changed = false;
      const next = { ...previous };
      Object.entries(previous).forEach(([key, record]) => {
        if (weeklyClosings[weekKeyForDateString(record.date)]) return;
        if (!editedIds.has(record.sessionId)) return;
        const recordWeekKey = weekKeyForDateString(record.date);
        const recordDefaultVersionKey = Object.keys(defaultScheduleVersions).filter((key) => key <= recordWeekKey).sort().pop();
        const recordWeekSessions = weekOverrides[recordWeekKey] || (recordDefaultVersionKey ? defaultScheduleVersions[recordDefaultVersionKey] : sessions);
        const session = recordWeekSessions.find((item) => item.id === record.sessionId);
        const student = students.find((item) => item.id === record.studentId);
        if (!session || !student || !session.studentIds.includes(student.id)) return;

        const differs = ["studentName", "start", "duration", "note", "details", "pricingMode", "unitPrice", "hourlyRate", "amount", "status"]
          .some((field) => refreshed[field] !== record[field]);

  // persist config to localStorage + clean the URL hash once read
  useEffect(() => {

    if (syncCfg) {
      try {

      try {
        localStorage.removeItem(SYNC_CFG_KEY);
      } catch (e) {}
    }
    // eslint-disable-next-line
  }, [syncCfg]);

  // connect to Firestore whenever syncCfg changes
  useEffect(() => {
    let cancelled = false;
    remoteReadyRef.current = false;
    collectionsReadyRef.current = false;
    collectionMigrationRef.current = false;
    collectionUnsubsRef.current.forEach((unsubscribe) => unsubscribe());
    collectionUnsubsRef.current = [];
    lastSyncedStateRef.current = null;
    if (unsubRef.current) {
      unsubRef.current();
      unsubRef.current = null;
    }
    if (!syncCfg || !syncCfg.apiKey || !syncCfg.projectId || !syncCfg.syncCode) {
      dbRef.current = null;
      setSyncStatus("offline");
      return;
    }
    setSyncStatus("connecting");
    try {
      const appName = `tutor-schedule-${syncCfg.projectId}`;
      const existing = firebase.apps.find((a) => a.name === appName);
      const fbApp = existing || firebase.initializeApp(syncCfg, appName);
      const db = firebase.firestore(fbApp);
      dbRef.current = db;
      const attachSyncListener = () => {
        if (cancelled || dbRef.current !== db) return;
        const docRef = db.collection("schedules").doc(syncCfg.syncCode);
        syncRootDocRef.current = docRef;
        const attachCollections = () => {
          if (cancelled || collectionsReadyRef.current) return;
          collectionsReadyRef.current = true;
          const lessonsUnsub = docRef.collection("lessons").onSnapshot((snapshot) => {
            const nextAttendance = {};
            const nextRecords = {};
            snapshot.forEach((lessonDoc) => {
              const lesson = lessonDoc.data();
              if (!lesson.key) return;
              nextAttendance[lesson.key] = lesson.status || "planned";
              if (lesson.record) nextRecords[lesson.key] = lesson.record;
            });
            lastSyncedLessonsRef.current = { attendance: nextAttendance, lessonRecords: nextRecords };
            setAttendance(nextAttendance);
            setLessonRecords(nextRecords);
          }, (error) => {
            console.warn("Lesson sync error:", error);
            setSyncStatus("error");
          });
          const closingsUnsub = docRef.collection("weeklyClosings").onSnapshot((snapshot) => {
            const nextClosings = {};
            snapshot.forEach((closingDoc) => { nextClosings[closingDoc.id] = closingDoc.data(); });
            lastSyncedClosingsRef.current = nextClosings;
            setWeeklyClosings(nextClosings);
          }, (error) => {
            console.warn("Weekly closing sync error:", error);
            setSyncStatus("error");
          });
          collectionUnsubsRef.current = [lessonsUnsub, closingsUnsub];
        };
        const writeCollectionDocuments = async (lessonsAttendance, lessonsRecords, closings) => {
          const operations = [];
          const lessonKeys = new Set([...Object.keys(lessonsAttendance || {}), ...Object.keys(lessonsRecords || {})]);
          lessonKeys.forEach((key) => operations.push({
            ref: docRef.collection("lessons").doc(encodeURIComponent(key)),
            data: { key, status: lessonsRecords?.[key]?.status || lessonsAttendance?.[key] || "planned", record: lessonsRecords?.[key] || null, revision: 1, updatedAt: Date.now() },
          }));
          Object.entries(closings || {}).forEach(([key, value]) => operations.push({
            ref: docRef.collection("weeklyClosings").doc(key),
            data: { ...value, revision: Number(value.revision || 0) + 1, updatedAt: Date.now() },
          }));
          for (let index = 0; index < operations.length; index += 400) {
            const batch = db.batch();
            operations.slice(index, index + 400).forEach((operation) => batch.set(operation.ref, operation.data, { merge: true }));
            await batch.commit();
          }
        };
        const migrateCollections = async (source, keepBackup) => {
          if (collectionMigrationRef.current) return;
          collectionMigrationRef.current = true;
          try {
            if (keepBackup) {
              await docRef.collection("backups").doc("schema-v2").set({
                attendance: source.attendance || {},
                lessonRecords: source.lessonRecords || {},
                weeklyClosings: source.weeklyClosings || {},
                backedUpAt: Date.now(),
              });
            }
            await writeCollectionDocuments(source.attendance || {}, source.lessonRecords || {}, source.weeklyClosings || {});
            await docRef.update({
              schemaVersion: 3,
              studentsById: itemsById(source.students || students),
              sessionsById: itemsById(source.sessions || sessions),
              weekOverrides: source.weekOverrides || weekOverrides,
              defaultScheduleVersions: source.defaultScheduleVersions || defaultScheduleVersions,
              lang: source.lang || lang,
              rowHeight: source.rowHeight || rowHeight,
              attendance: firebase.firestore.FieldValue.delete(),
              lessonRecords: firebase.firestore.FieldValue.delete(),
              weeklyClosings: firebase.firestore.FieldValue.delete(),
              migratedToCollectionsAt: Date.now(),
            });
          } catch (error) {
            collectionMigrationRef.current = false;
            console.warn("Collection migration failed:", error);
            setSyncStatus("error");
          }
        };
        unsubRef.current = docRef.onSnapshot(
        (snap) => {
          setSyncStatus("synced");
          if (snap.exists) {
            const data = snap.data();
            const schemaVersion = Number(data.schemaVersion || 1);
            remoteReadyRef.current = true;
            const remoteStudents = data.studentsById ? Object.values(data.studentsById) : (data.students || students);
            const remoteSessions = (data.sessionsById ? Object.values(data.sessionsById) : (data.sessions || sessions))
              .map((session) => normalizeSession(session, remoteStudents));
            const remoteWeekOverrides = Object.fromEntries(Object.entries(data.weekOverrides || {}).map(([weekKey, items]) => [
              weekKey,
              (items || []).map((session) => normalizeSession(session, remoteStudents)),
            ]));
            const remoteDefaultScheduleVersions = Object.fromEntries(Object.entries(data.defaultScheduleVersions || {}).map(([weekKey, items]) => [
              weekKey,
              (items || []).map((session) => normalizeSession(session, remoteStudents)),
            ]));
            const remoteAttendance = schemaVersion >= 3 ? attendance : (data.attendance || {});
            const remoteLessonRecords = data.lessonRecords
              ? normalizeLessonRecords(data.lessonRecords)
              : (schemaVersion >= 3 ? lessonRecords : migrateLegacyAttendance(remoteAttendance, remoteSessions, remoteStudents));
            const remoteWeeklyClosings = schemaVersion >= 3 ? weeklyClosings : (data.weeklyClosings || {});
            const remoteLang = data.lang || lang;
            const remoteRowHeight = data.rowHeight || rowHeight;
            const remoteState = {
              students: remoteStudents,
              sessions: remoteSessions,
              weekOverrides: remoteWeekOverrides,
              defaultScheduleVersions: remoteDefaultScheduleVersions,
              attendance: remoteAttendance,
              lessonRecords: remoteLessonRecords,
              weeklyClosings: remoteWeeklyClosings,
              lang: remoteLang,
              rowHeight: remoteRowHeight,
            };
            lastSyncedStateRef.current = remoteState;
            setStudents(remoteStudents);
            setSessions(remoteSessions);
            setWeekOverrides(remoteWeekOverrides);
            setDefaultScheduleVersions(remoteDefaultScheduleVersions);
            if (schemaVersion < 3) {
              setAttendance(remoteAttendance);
              setLessonRecords(remoteLessonRecords);
              setWeeklyClosings(remoteWeeklyClosings);
            }
            setLang(remoteLang);
            setRowHeight(remoteRowHeight);
            if (schemaVersion < 3) {
              migrateCollections({
                students: remoteStudents,
                sessions: remoteSessions,
                weekOverrides: remoteWeekOverrides,
                defaultScheduleVersions: remoteDefaultScheduleVersions,
                attendance: remoteAttendance,
                lessonRecords: remoteLessonRecords,
                weeklyClosings: remoteWeeklyClosings,
                lang: remoteLang,
                rowHeight: remoteRowHeight,
              }, true);
            } else {
              attachCollections();
            }
          } else {
            if (collectionMigrationRef.current) return;
            collectionMigrationRef.current = true;
            writeCollectionDocuments(attendance, lessonRecords, weeklyClosings)
              .then(() => docRef.set({
                schemaVersion: 3,
                studentsById: itemsById(students),
                sessionsById: itemsById(sessions),
                weekOverrides,
                defaultScheduleVersions,
                lang,
                rowHeight,
                updatedAt: Date.now(),
              }))
              .catch((e) => {
                collectionMigrationRef.current = false;
                console.warn("Initial sync failed:", e);
                setSyncStatus("error");
              });
          }
        },
        (err) => {
          console.warn("Sync error:", err);
          setSyncStatus("error");
        }
        );
      };
      let persistenceReady = Promise.resolve();
      if (!FIREBASE_PERSISTENCE_APPS.has(appName)) {
        FIREBASE_PERSISTENCE_APPS.add(appName);
        persistenceReady = db.enablePersistence({ synchronizeTabs: true }).catch((error) => {
          if (error?.code !== "failed-precondition" && error?.code !== "unimplemented") {
            console.warn("Offline persistence unavailable:", error);
          }
        });
      }
      persistenceReady.then(attachSyncListener);
    } catch (e) {
      console.warn("Could not connect sync:", e);
      setSyncStatus("error");
    }
    return () => {
      cancelled = true;
      if (unsubRef.current) unsubRef.current();
      collectionUnsubsRef.current.forEach((unsubscribe) => unsubscribe());
      collectionUnsubsRef.current = [];
    };
    // eslint-disable-next-line
  }, [syncCfg?.apiKey, syncCfg?.projectId, syncCfg?.syncCode]);

  // Save locally and update only changed Firebase fields. This prevents one browser
  // from replacing unrelated students, classes or attendance written by another.
  useEffect(() => {
    const payload = { students, sessions, weekOverrides, defaultScheduleVersions, attendance, lessonRecords, weeklyClosings, lang, rowHeight };
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
    } catch (e) {
      console.warn("Could not save schedule:", e);
    }
    const previous = lastSyncedStateRef.current;
    if (!dbRef.current || !syncCfg?.syncCode || !remoteReadyRef.current || !previous) return;
    const updates = {};
    const addMapChanges = (field, previousMap, nextMap) => {
      const ids = new Set([...Object.keys(previousMap || {}), ...Object.keys(nextMap || {})]);
      ids.forEach((id) => {
        const before = previousMap?.[id];
        const after = nextMap?.[id];
        if (JSON.stringify(before) === JSON.stringify(after)) return;
        updates[`${field}.${id}`] = after === undefined ? firebase.firestore.FieldValue.delete() : after;
      });
    };
    addMapChanges("studentsById", itemsById(previous.students), itemsById(students));
    addMapChanges("sessionsById", itemsById(previous.sessions), itemsById(sessions));
    addMapChanges("weekOverrides", previous.weekOverrides || {}, weekOverrides);
    addMapChanges("defaultScheduleVersions", previous.defaultScheduleVersions || {}, defaultScheduleVersions);
    if (previous.lang !== lang) updates.lang = lang;
    if (previous.rowHeight !== rowHeight) updates.rowHeight = rowHeight;
    if (!Object.keys(updates).length) return;
    updates.schemaVersion = 3;
    updates.updatedAt = Date.now();
    lastSyncedStateRef.current = payload;
    setSyncStatus("connecting");
    dbRef.current
      .collection("schedules")
      .doc(syncCfg.syncCode)
      .update(updates)
      .catch((error) => {
        lastSyncedStateRef.current = previous;
        console.warn("Atomic sync failed:", error);
        setSyncStatus("error");
      });
  }, [students, sessions, weekOverrides, defaultScheduleVersions, attendance, lessonRecords, weeklyClosings, lang, rowHeight]);

  useEffect(() => {
    const docRef = syncRootDocRef.current;
    if (!docRef || !collectionsReadyRef.current) return;
    const previous = lastSyncedLessonsRef.current;
    const keys = new Set([
      ...Object.keys(previous.attendance || {}),
      ...Object.keys(previous.lessonRecords || {}),
      ...Object.keys(attendance || {}),
      ...Object.keys(lessonRecords || {}),
    ]);
    const changedKeys = Array.from(keys).filter((key) =>
      previous.attendance?.[key] !== attendance[key] ||
      JSON.stringify(previous.lessonRecords?.[key]) !== JSON.stringify(lessonRecords[key])
    );
    if (!changedKeys.length) return;
    lastSyncedLessonsRef.current = { attendance, lessonRecords };
    setSyncStatus("connecting");
    Promise.all(changedKeys.map((key) => {
      const lessonRef = docRef.collection("lessons").doc(encodeURIComponent(key));
      if (attendance[key] === undefined && lessonRecords[key] === undefined) return lessonRef.delete();
      return dbRef.current.runTransaction(async (transaction) => {
        const snapshot = await transaction.get(lessonRef);
        const revision = snapshot.exists ? Number(snapshot.data().revision || 0) + 1 : 1;
        transaction.set(lessonRef, {
          key,
          status: lessonRecords[key]?.status || attendance[key] || "planned",
          record: lessonRecords[key] || null,
          revision,
          updatedAt: Date.now(),
        });
      });
    })).catch((error) => {
      lastSyncedLessonsRef.current = previous;
      console.warn("Lesson write failed:", error);
      setSyncStatus("error");
    });
  }, [attendance, lessonRecords]);

  useEffect(() => {
    const docRef = syncRootDocRef.current;
    if (!docRef || !collectionsReadyRef.current) return;
    const previous = lastSyncedClosingsRef.current;
    const keys = new Set([...Object.keys(previous || {}), ...Object.keys(weeklyClosings || {})]);
    const changedKeys = Array.from(keys).filter((key) => JSON.stringify(previous[key]) !== JSON.stringify(weeklyClosings[key]));
    if (!changedKeys.length) return;
    lastSyncedClosingsRef.current = weeklyClosings;
    setSyncStatus("connecting");
    Promise.all(changedKeys.map((key) => {
      const closingRef = docRef.collection("weeklyClosings").doc(key);
      if (weeklyClosings[key] === undefined) return closingRef.delete();
      return dbRef.current.runTransaction(async (transaction) => {
        const snapshot = await transaction.get(closingRef);
        const revision = snapshot.exists ? Number(snapshot.data().revision || 0) + 1 : 1;
        transaction.set(closingRef, { ...weeklyClosings[key], revision, updatedAt: Date.now() });
      });
    })).catch((error) => {
      lastSyncedClosingsRef.current = previous;
      console.warn("Weekly closing write failed:", error);
      setSyncStatus("error");
    });
  }, [weeklyClosings]);

  function connectSync() {
    try {
      const cfg = JSON.parse(
        syncConfigText
          .replace(/([{,]\s*)([A-Za-z_$][\w$]*)\s*:/g, '$1"$2":')
          .replace(/'/g, '"')
      );
      const code = syncCodeInput.trim() || randomSyncCode();
      if (!/^[A-Za-z0-9_-]{3,80}$/.test(code)) {
        setSyncInputError(t.invalidSyncCode);
        return;
      }
      setSyncInputError("");
      setSyncCfg({ ...cfg, syncCode: code });
      setSyncModalOpen(false);
    } catch (e) {
      setSyncInputError(t.invalidFirebaseConfig);
    }
  }

  function disconnectSync() {
    setSyncCfg(null);
    setSyncModalOpen(false);
  }

  function copySyncLink() {
    if (!syncCfg) return;
    const b64 = btoa(unescape(encodeURIComponent(JSON.stringify(syncCfg))));
    const link = window.location.origin + window.location.pathname + "#sync=" + b64;
    if (navigator.clipboard?.writeText) {
      navigator.clipboard
        .writeText(link)
        .then(() => setCopyFeedback(lang === "vi" ? "Đã sao chép!" : "Copied!"))
        .catch(() => setCopyFeedback(link));
    } else {
      setCopyFeedback(link);
    }
    setTimeout(() => setCopyFeedback(""), 4000);
  }

  const usedColors = new Set(students.map((student) => student.color));
  const nextColor = STUDENT_COLORS.findIndex((_, index) => !usedColors.has(index));
  const suggestedColor = nextColor >= 0 ? nextColor : students.length % STUDENT_COLORS.length;

  function addStudent() {
    const name = newStudentName.trim();
    if (!name) return;
    setStudents((prev) => [
      ...prev,
      { id: uid(), name, color: suggestedColor, hourlyRate: Math.max(0, Number(newStudentRate) || 0) },
    ]);
    setNewStudentName("");
    setNewStudentRate(200000);
    setAddingStudent(false);
  }

  function saveStudentModal() {
    const name = studentModal.name.trim();
    if (!name) return;
    const latestStudent = students.find((student) => student.id === studentModal.id);
    if (studentModal._originalSignature && JSON.stringify(latestStudent) !== studentModal._originalSignature) {
      setStudentModal({ ...studentModal, error: t.conflictError });
      return;
    }
    [...sessions, ...Object.values(weekOverrides).flat(), ...Object.values(defaultScheduleVersions).flat()]
      .filter((session) => session.studentIds.includes(studentModal.id))
      .forEach((session) => recordsRefreshSessionIdsRef.current.add(session.id));
    setStudents((prev) =>
      prev.map((s) =>
        s.id === studentModal.id
          ? { ...s, name, hourlyRate: Math.max(0, Number(studentModal.hourlyRate) || 0), color: studentModal.color }
          : s
      )
    );
    setStudentModal(null);
  }

  function removeStudent(id) {
    setStudents((prev) => prev.filter((s) => s.id !== id));
    setSessions((prev) =>
      prev
        .map((session) => {
          const studentIds = session.studentIds.filter((studentId) => studentId !== id);
          const studentRates = { ...session.studentRates };
          const studentPricing = { ...session.studentPricing };
          delete studentRates[id];
          delete studentPricing[id];
          return { ...session, studentIds, studentRates, studentPricing, studentId: studentIds[0] || null };
        })
        .filter((session) => session.studentIds.length > 0)
    );
    setWeekOverrides((previous) => Object.fromEntries(Object.entries(previous).map(([weekKey, items]) => [
      weekKey,
      items.map((session) => {
        const studentIds = session.studentIds.filter((studentId) => studentId !== id);
        const studentRates = { ...session.studentRates };
        const studentPricing = { ...session.studentPricing };
        delete studentRates[id];
        delete studentPricing[id];
        return { ...session, studentIds, studentRates, studentPricing, studentId: studentIds[0] || null };
      }).filter((session) => session.studentIds.length > 0),
    ])));
    setDefaultScheduleVersions((previous) => Object.fromEntries(Object.entries(previous).map(([weekKey, items]) => [
      weekKey,
      items.map((session) => {
        const studentIds = session.studentIds.filter((studentId) => studentId !== id);
        const studentRates = { ...session.studentRates };
        const studentPricing = { ...session.studentPricing };
        delete studentRates[id];
        delete studentPricing[id];
        return { ...session, studentIds, studentRates, studentPricing, studentId: studentIds[0] || null };
      }).filter((session) => session.studentIds.length > 0),
    ])));
    if (filterId === id) setFilterId(null);
    setConfirmDeleteStudent(null);
  }

  function updateViewedWeekSessions(updater) {
    setWeekOverrides((previous) => {
      const base = previous[viewWeekKey] || activeSessionsForView;
      return { ...previous, [viewWeekKey]: updater(base.map((session) => normalizeSession({ ...session }, students))) };
    });
  }
  // Luôn giữ ref trỏ tới bản mới nhất của updateViewedWeekSessions (đóng gói viewWeekKey/activeSessionsForView
  // của lần render hiện tại), để các callback được memo hóa (onDragMove, onResizeMove) không dùng phải
  // closure cũ khi người dùng đã chuyển sang xem một tuần khác.
  updateViewedWeekSessionsRef.current = updateViewedWeekSessions;

  function openAddModal(day, startMin) {
    if (students.length === 0) {
      setAddingStudent(true);
      return;
    }
    const initialStudentId = filterId || students[0].id;
    const initialStudent = students.find((student) => student.id === initialStudentId);
    setModal({
      mode: "add",
      studentId: initialStudentId,
      studentIds: [initialStudentId],
      studentRates: { [initialStudentId]: Number(initialStudent?.hourlyRate) || 0 },
      studentPricing: { [initialStudentId]: { mode: "hourly", amount: Number(initialStudent?.hourlyRate) || 0 } },
      day,
      start: clamp(Math.round(startMin / SNAP) * SNAP, START_MIN, END_MIN - MIN_DURATION),
      duration: 60,
      note: "",
      details: "",
    });
  }

  function openEditModal(session) {
    setModal({ mode: "edit", id: session.id, ...session, duration: Math.max(MIN_DURATION, session.duration), _originalSignature: JSON.stringify(session) });
  }

  function openHistoricalModal(session) {
    setModal({
      mode: "history",
      id: session._sourceSessionId,
      occurrenceDate: session._occurrenceDate,
      studentId: session.studentId,
      studentIds: [...session.studentIds],
      studentRates: { ...session.studentRates },
      studentPricing: { ...session.studentPricing },
      historicalMembers: session._members || [],
      day: session.day,
      start: session.start,
      duration: session.duration,
      note: session.note || "",
      details: session.details || "",
    });
  }

  function saveModal() {
    if (modal.duration < MIN_DURATION || modal.start + modal.duration > END_MIN) return;
    if (!modal.studentIds?.length) return;
    if (modal.mode === "edit") {
      const latestSession = (weekOverrides[viewWeekKey] || activeSessionsForView).find((session) => session.id === modal.id);
      if (modal._originalSignature && JSON.stringify(latestSession) !== modal._originalSignature) {
        setModal({ ...modal, error: t.conflictError });
        return;
      }
    }
    const sessionValues = {
      studentId: modal.studentIds[0],
      studentIds: modal.studentIds,
      studentRates: modal.studentRates,
      studentPricing: modal.studentPricing,
      day: modal.day,
      start: modal.start,
      duration: modal.duration,
      note: modal.note,
      details: modal.details || "",
    };
    if (modal.mode === "history") {
      const baseKey = `${modal.occurrenceDate}|${modal.id}`;
      setLessonRecords((previous) => {
        const next = { ...previous };
        modal.studentIds.forEach((studentId) => {
          const key = `${baseKey}|${studentId}`;
          const existing = previous[key];
          const student = students.find((item) => item.id === studentId);
          if (!existing || !student) return;
          next[key] = lessonRecordFromTemplate(key, { id: modal.id, ...sessionValues }, student, existing.status);
        });
        return next;
      });
      setModal(null);
      return;
    }
    if (modal.mode === "add") {
      updateViewedWeekSessions((prev) => [
        ...prev,
        {
          id: uid(),
          ...sessionValues,
          effectiveFrom: viewWeekKey,
        },
      ]);
    } else {
      recordsRefreshSessionIdsRef.current.add(modal.id);
      updateViewedWeekSessions((prev) =>
        prev.map((s) =>
          s.id === modal.id
            ? { ...s, ...sessionValues }
            : s
        )
      );
    }
    setModal(null);
  }

  function deleteModalSession() {
    if (modal.mode === "history") {
      const prefix = `${modal.occurrenceDate}|${modal.id}|`;
      setAttendance((previous) => Object.fromEntries(Object.entries(previous).filter(([key]) => !key.startsWith(prefix))));
      setLessonRecords((previous) => Object.fromEntries(Object.entries(previous).filter(([key]) => !key.startsWith(prefix))));
      setModal(null);
      return;
    }
    updateViewedWeekSessions((prev) => prev.filter((s) => s.id !== modal.id));
    setModal(null);
  }

  const onSessionMouseDown = useCallback(
    (e, session) => {
      e.stopPropagation();
      if (viewedWeekClosingRef.current) return;
      if (e.button !== 0) return;
      const rect = gridRef.current.getBoundingClientRect();
      dragState.current = {
        id: session.id,
        moved: false,
        startX: e.clientX,
        startY: e.clientY,
        origDay: session.day,
        origStart: session.start,
        rect,
        colWidth: rect.width / 7,
      };
      window.addEventListener("mousemove", onDragMove);
      window.addEventListener("mouseup", onDragUp);
    },
    [rowHeight]
  );

  const onDragMove = useCallback(
    (e) => {
      const ds = dragState.current;
      if (!ds) return;
      const dx = e.clientX - ds.startX;
      const dy = e.clientY - ds.startY;
      if (!ds.moved && Math.abs(dx) < 4 && Math.abs(dy) < 4) return;
      ds.moved = true;
      suppressSessionEditRef.current = true;

      const deltaMinutes = (dy / rowHeight) * 60;
      let newStart = Math.round((ds.origStart + deltaMinutes) / SNAP) * SNAP;
      newStart = clamp(newStart, START_MIN, END_MIN - MIN_DURATION);

      const dayIndex = clamp(Math.floor((e.clientX - ds.rect.left) / ds.colWidth), 0, 6);

      updateViewedWeekSessionsRef.current((prev) =>
        prev.map((s) =>
          s.id === ds.id
            ? (recordsRefreshSessionIdsRef.current.add(s.id), { ...s, day: dayIndex, start: clamp(newStart, START_MIN, END_MIN - s.duration) })
            : s
        )
      );
    },
    [rowHeight]
  );

  const onDragUp = useCallback(() => {
    const wasMoved = Boolean(dragState.current?.moved);
    window.removeEventListener("mousemove", onDragMove);
    window.removeEventListener("mouseup", onDragUp);
    dragState.current = null;
    if (wasMoved) {
      window.setTimeout(() => {
        suppressSessionEditRef.current = false;
      }, 500);
    }
  }, [onDragMove]);

  const resizeState = useRef(null);
  const onResizeMouseDown = useCallback(
    (e, session) => {
      if (viewedWeekClosingRef.current) return;
      e.stopPropagation();
      e.preventDefault();
      resizeState.current = { id: session.id, startY: e.clientY, origDuration: session.duration };
      window.addEventListener("mousemove", onResizeMove);
      window.addEventListener("mouseup", onResizeUp);
    },
    [rowHeight]
  );
  const onResizeMove = useCallback(
    (e) => {
      const rs = resizeState.current;
      if (!rs) return;
      const dy = e.clientY - rs.startY;
      const deltaMinutes = (dy / rowHeight) * 60;
      let newDuration = Math.round((rs.origDuration + deltaMinutes) / SNAP) * SNAP;
      newDuration = clamp(newDuration, MIN_DURATION, END_MIN - START_MIN);
      updateViewedWeekSessionsRef.current((prev) =>
        prev.map((s) =>
          s.id === rs.id
            ? (recordsRefreshSessionIdsRef.current.add(s.id), { ...s, duration: clamp(newDuration, MIN_DURATION, END_MIN - s.start) })
            : s
        )
      );
    },
    [rowHeight]
  );
  const onResizeUp = useCallback(() => {
    window.removeEventListener("mousemove", onResizeMove);
    window.removeEventListener("mouseup", onResizeUp);
    resizeState.current = null;
  }, [onResizeMove]);

  function onColumnClick(e, dayIndex) {
    if (viewedWeekClosing) return;
    if (dragState.current && dragState.current.moved) return;
    const rect = e.currentTarget.getBoundingClientRect();
    const y = e.clientY - rect.top;
    const minutes = START_MIN + (y / rowHeight) * 60;
    openAddModal(dayIndex, minutes);
  }

  const totalHeight = rowHeight * (END_HOUR - START_HOUR);
  const jsDay = now.getDay();
  const todayIndex = (jsDay + 6) % 7;
  const nowMinutes = now.getHours() * 60 + now.getMinutes();
  const mondayOfCurrentWeek = startOfWeek(now);
  const viewWeekKey = dateKey(viewWeekStart);
  const isCurrentWeek = viewWeekKey === dateKey(mondayOfCurrentWeek);
  const viewedWeekClosing = weeklyClosings[viewWeekKey];
  viewedWeekClosingRef.current = Boolean(viewedWeekClosing);
  const viewWeekDates = Array.from({ length: 7 }, (_, index) => {
    const date = new Date(viewWeekStart);
    date.setDate(viewWeekStart.getDate() + index);
    return date;
  });
  function currentWeekOccurrenceKey(session) {
    if (session._occurrenceDate) return `${session._occurrenceDate}|${session._sourceSessionId}`;
    const lessonDate = new Date(viewWeekStart);
    lessonDate.setDate(viewWeekStart.getDate() + session.day);
    return `${dateKey(lessonDate)}|${session.id}`;
  }

  const studentById = (id) => students.find((s) => s.id === id);
  const scheduleStudentById = (id) => (viewedWeekClosing?.studentsSnapshot || students).find((s) => s.id === id);
  const colorFor = (student) => STUDENT_COLORS[(student?.color ?? 0) % STUDENT_COLORS.length];

  const applicableDefaultVersionKey = Object.keys(defaultScheduleVersions)
    .filter((weekKey) => weekKey <= viewWeekKey)
    .sort()
    .pop();
  const versionedDefaultSessions = applicableDefaultVersionKey ? defaultScheduleVersions[applicableDefaultVersionKey] : sessions;
  const defaultSessionsForView = versionedDefaultSessions.filter((session) => {
    const occurrenceDate = dateKey(viewWeekDates[session.day]);
    return occurrenceDate >= (session.effectiveFrom || "1970-01-01");
  });
  const activeSessionsForView = weekOverrides[viewWeekKey] || defaultSessionsForView;
  function setViewedWeekAsDefault() {
    const sourceSessions = viewedWeekClosing?.sessionsSnapshot || activeSessionsForView;
    const nextDefault = sourceSessions.map((session) => normalizeSession({
      ...session,
      effectiveFrom: viewWeekKey,
      studentIds: [...session.studentIds],
      studentRates: { ...session.studentRates },
      studentPricing: { ...session.studentPricing },
    }, students));
    setDefaultScheduleVersions((previous) => ({ ...previous, [viewWeekKey]: nextDefault }));
    setWeekOverrides((previous) => {
      const next = { ...previous };
      delete next[viewWeekKey];
      return next;
    });
    setDefaultScheduleFeedback(t.defaultScheduleSet);
    window.setTimeout(() => setDefaultScheduleFeedback(""), 3500);
  }
  const scheduleSessions = viewedWeekClosing?.sessionsSnapshot || activeSessionsForView;
  const historicalGroupsForView = new Map();
  Object.values(lessonRecords).forEach((record) => {
    if (record.date < viewWeekKey || record.date > dateKey(viewWeekDates[6])) return;
    const groupKey = `${record.date}|${record.sessionId}`;
    if (!historicalGroupsForView.has(groupKey)) historicalGroupsForView.set(groupKey, []);
    historicalGroupsForView.get(groupKey).push(record);
  });
  const historicalSessionsForView = Array.from(historicalGroupsForView.entries()).map(([groupKey, records]) => {
    const first = records[0];
    const occurrenceDate = new Date(`${first.date}T00:00:00`);
    return {
      id: `history-${groupKey}`,
      _sourceSessionId: first.sessionId,
      _occurrenceDate: first.date,
      _historical: true,
      day: Math.round((occurrenceDate - viewWeekStart) / 86400000),
      start: first.start,
      duration: first.duration,
      note: first.note,
      details: first.details || "",
      studentId: first.studentId,
      studentIds: records.map((record) => record.studentId),
      studentRates: Object.fromEntries(records.map((record) => [record.studentId, record.hourlyRate])),
      studentPricing: Object.fromEntries(records.map((record) => [record.studentId, {
        mode: record.pricingMode || "hourly",
        amount: Number(record.unitPrice ?? record.hourlyRate) || 0,
      }])),
      _members: records.map((record) => students.find((student) => student.id === record.studentId) || ({
        id: record.studentId,
        name: record.studentName,
        hourlyRate: record.hourlyRate,
        color: 0,
      })),
    };
  });
  const historicalOccurrenceKeys = new Set(historicalSessionsForView.map((session) => `${session._occurrenceDate}|${session._sourceSessionId}`));
  const templateSessionsWithoutRecordedOccurrence = scheduleSessions.filter((session) => {
    const occurrenceDate = dateKey(viewWeekDates[session.day]);
    return !historicalOccurrenceKeys.has(`${occurrenceDate}|${session.id}`);
  });
  const visibleSessions = [...templateSessionsWithoutRecordedOccurrence, ...historicalSessionsForView]
    .filter((s) => !filterId || s.studentIds.includes(filterId));
  function overlapStyleFor(session) {
    const peers = visibleSessions
      .filter((other) => other.day === session.day && other.start < session.start + session.duration && session.start < other.start + other.duration)
      .sort((a, b) => a.start - b.start || a.id.localeCompare(b.id));
    if (peers.length <= 1) return { left: 2, right: 2 };
    const index = Math.max(0, peers.findIndex((peer) => peer.id === session.id));
    return {
      left: `calc(${(index * 100) / peers.length}% + 2px)`,
      width: `calc(${100 / peers.length}% - 4px)`,
    };
  }
  const modalHasOverlap = Boolean(modal && activeSessionsForView.some((session) =>
    session.id !== modal.id &&
    session.day === modal.day &&
    session.start < modal.start + modal.duration &&
    modal.start < session.start + session.duration
  ));

  function updateLessonStatus(key, session, student, status) {
    if (weeklyClosings[weekKeyForDateString(key.slice(0, 10))]) return;
    const updatedRecord = status === "planned" ? null : lessonRecordFromTemplate(key, session, student, status);
    setAttendance((prev) => ({ ...prev, [key]: status }));
    setLessonRecords((prev) => {
      if (status === "planned") {
        const next = { ...prev };
        delete next[key];
        return next;
      }
      return { ...prev, [key]: updatedRecord };
    });
  }

  const viewWeekEnd = dateKey(viewWeekDates[6]);
  const viewWeekCompletedRecords = Object.values(lessonRecords).filter(
    (record) => record.date >= viewWeekKey && record.date <= viewWeekEnd && record.status === "completed"
  );
  const viewWeekClassRecords = Array.from(
    new Map(viewWeekCompletedRecords.map((record) => [`${record.date}|${record.sessionId}`, record])).values()
  );
  const viewWeekSummary = {
    sessions: viewWeekClassRecords.length,
    minutes: viewWeekClassRecords.reduce((sum, record) => sum + record.duration, 0),
    amount: viewWeekCompletedRecords.reduce((sum, record) => sum + record.amount, 0),
  };

  function finishCloseWeek() {
    if (closeWeekModal?.mode === "reopen") {
      // Khôi phục đúng lịch đã được chốt (sessionsSnapshot) thành một weekOverride riêng cho tuần này,
      // thay vì để tuần rơi về lịch mặc định/đè hiện tại. Nếu không làm vậy, khi lịch mặc định đã
      // thay đổi kể từ lúc chốt tuần, mở lại tuần cũ sẽ hiển thị SAI lịch (không đúng buổi đã dạy thật).
      const closing = weeklyClosings[viewWeekKey];
      if (closing?.sessionsSnapshot) {
        setWeekOverrides((prev) => ({
          ...prev,
          [viewWeekKey]: closing.sessionsSnapshot.map((session) => normalizeSession({ ...session }, students)),
        }));
      }
      setWeeklyClosings((prev) => {
        const next = { ...prev };
        delete next[viewWeekKey];
        return next;
      });
      setCloseWeekModal(null);
      return;
    }
    setWeeklyClosings((prev) => ({
      ...prev,
      [viewWeekKey]: {
        weekStart: viewWeekKey,
        weekEnd: viewWeekEnd,
        sessions: viewWeekSummary.sessions,
        minutes: viewWeekSummary.minutes,
        amount: viewWeekSummary.amount,
        sessionsSnapshot: activeSessionsForView.map((session) => ({
          ...session,
          studentIds: [...session.studentIds],
          studentRates: { ...session.studentRates },
          studentPricing: Object.fromEntries(Object.entries(session.studentPricing || {}).map(([id, pricing]) => [id, { ...pricing }])),
        })),
        studentsSnapshot: students.map((student) => ({ ...student })),
        closedAt: Date.now(),
      },
    }));
    setCloseWeekModal(null);
    setViewWeekStart((current) => {
      const next = new Date(current);
      next.setDate(current.getDate() + 7);
      return next;
    });
  }

  const [payrollYear, payrollMonthNumber] = payrollMonth.split("-").map(Number);
  const payrollOccurrences = [];
  const payrollOccurrenceKeys = new Set();
  function occurrenceFromRecord(record) {
    const student = students.find((item) => item.id === record.studentId) || {
      id: record.studentId,
      name: record.studentName,
      hourlyRate: record.hourlyRate,
    };
    return {
      key: record.key,
      date: new Date(`${record.date}T00:00:00`),
      session: {
        id: record.sessionId,
        studentId: record.studentId,
        start: record.start,
        duration: record.duration,
        note: record.note,
        details: record.details || "",
        studentPricing: { [record.studentId]: { mode: record.pricingMode || "hourly", amount: Number(record.unitPrice ?? record.hourlyRate) || 0 } },
      },
      student: { ...student, name: record.studentName, hourlyRate: Number(record.unitPrice ?? record.hourlyRate) || 0 },
      pricingMode: record.pricingMode || "hourly",
      unitPrice: Number(record.unitPrice ?? record.hourlyRate) || 0,
      status: record.status,
      amount: record.amount,
    };
  }
  if (payrollYear && payrollMonthNumber) {
    const daysInMonth = new Date(payrollYear, payrollMonthNumber, 0).getDate();
    for (let dayOfMonth = 1; dayOfMonth <= daysInMonth; dayOfMonth += 1) {
      const date = new Date(payrollYear, payrollMonthNumber - 1, dayOfMonth);
      const weekday = (date.getDay() + 6) % 7;
      const lessonDate = dateKey(date);
      const occurrenceWeekKey = weekKeyForDateString(lessonDate);
      const closingForDate = weeklyClosings[occurrenceWeekKey];
      const occurrenceDefaultVersionKey = Object.keys(defaultScheduleVersions).filter((key) => key <= occurrenceWeekKey).sort().pop();
      const occurrenceDefaultSessions = occurrenceDefaultVersionKey ? defaultScheduleVersions[occurrenceDefaultVersionKey] : sessions;
      const sessionsForDate = closingForDate?.sessionsSnapshot || weekOverrides[occurrenceWeekKey] || occurrenceDefaultSessions;
      const studentsForDate = closingForDate?.studentsSnapshot || students;
      sessionsForDate
        .filter((session) => session.day === weekday && lessonDate >= (session.effectiveFrom || "1970-01-01"))
        .forEach((session) => {
          session.studentIds.forEach((studentId) => {
            const key = `${lessonDate}|${session.id}|${studentId}`;
            payrollOccurrenceKeys.add(key);
            const storedRecord = lessonRecords[key];
            if (storedRecord) {
              payrollOccurrences.push(occurrenceFromRecord(storedRecord));
              return;
            }
            const student = studentsForDate.find((item) => item.id === studentId);
            const status = attendance[key] || "planned";
            const pricing = pricingForStudent(session, student);
            const amount = status === "completed" ? calculatedLessonFee(session, student) : 0;
            payrollOccurrences.push({
              key,
              date,
              session: { ...session, studentId },
              student: student ? { ...student, hourlyRate: pricing.amount } : null,
              pricingMode: pricing.mode,
              unitPrice: pricing.amount,
              status,
              amount,
            });
          });
        });
    }
    Object.values(lessonRecords).forEach((record) => {
      if (record.date.slice(0, 7) === payrollMonth && !payrollOccurrenceKeys.has(record.key)) {
        payrollOccurrences.push(occurrenceFromRecord(record));
        payrollOccurrenceKeys.add(record.key);
      }
    });
  }
  payrollOccurrences.sort((a, b) => a.date - b.date || a.session.start - b.session.start);
  const payrollStudents = new Map(students.map((student) => [student.id, student]));
  Object.values(lessonRecords).forEach((record) => {
    if (!payrollStudents.has(record.studentId)) {
      payrollStudents.set(record.studentId, { id: record.studentId, name: record.studentName, hourlyRate: record.hourlyRate });
    }
  });
  const payrollRows = Array.from(payrollStudents.values()).map((student) => {
    const rows = payrollOccurrences.filter((item) => item.student?.id === student.id && item.status === "completed");
    const rates = [...new Set(rows.map((item) => Number(item.student?.hourlyRate) || 0))];
    const priceDescriptions = [...new Set(rows.map((item) => `${item.pricingMode || "hourly"}|${Number(item.unitPrice ?? item.student?.hourlyRate) || 0}`))];
    return {
      student,
      sessions: rows.length,
      minutes: rows.reduce((sum, item) => sum + item.session.duration, 0),
      amount: rows.reduce((sum, item) => sum + item.amount, 0),
      hourlyRate: rates.length === 1 ? rates[0] : null,
      priceDescription: priceDescriptions.length === 1 ? priceDescriptions[0] : null,
    };
  }).filter((row) => row.sessions > 0);
  const attendanceDetailRows = Array.from(payrollStudents.values()).map((student) => ({
    student,
    attended: payrollOccurrences.filter((item) => item.student?.id === student.id && item.status === "completed"),
    absent: payrollOccurrences.filter((item) => item.student?.id === student.id && item.status === "cancelled"),
  })).filter((row) => row.attended.length || row.absent.length);
  const payrollTotal = payrollRows.reduce((sum, row) => sum + row.amount, 0);

  return (
    <div
      className="w-full min-h-screen flex flex-col"
      style={{ background: "#F3F5F7", color: "#16213E" }}
    >
      <div className="px-6 pt-6 pb-4 flex items-center justify-between flex-wrap gap-3" style={{ background: "#1B2A4A" }}>
        <div>
          <h1 className="text-xl font-semibold tracking-tight" style={{ color: "#F3F5F7" }}>
            {t.title}
          </h1>
          <p className="text-sm mt-0.5" style={{ color: "#8FA0C2" }}>
            {t.subtitle}
          </p>
        </div>
        <div className="flex items-center gap-2">
          <div className="flex items-center rounded-lg overflow-hidden" style={{ background: "#25365C", color: "#F3F5F7" }}>
            <button
              onClick={() => setViewWeekStart((current) => { const previous = new Date(current); previous.setDate(current.getDate() - 7); return previous; })}
              className="p-2 hover:opacity-70"
              title="Previous week"
            ><ChevronLeft size={16} /></button>
            <button
              onClick={() => setViewWeekStart(startOfWeek(new Date()))}
              className="px-2 text-xs font-medium hover:opacity-70 whitespace-nowrap"
            >{viewWeekKey.slice(5)} → {viewWeekEnd.slice(5)}</button>
            <button
              onClick={() => setViewWeekStart((current) => { const next = new Date(current); next.setDate(current.getDate() + 7); return next; })}
              className="p-2 hover:opacity-70"
              title="Next week"
            ><ChevronRight size={16} /></button>
          </div>
          <button
            onClick={setViewedWeekAsDefault}
            className="flex items-center gap-1.5 px-3 py-2 rounded-lg text-sm font-medium transition hover:opacity-80"
            style={{ background: "#4C6EF5", color: "#FFFFFF" }}
            title={defaultScheduleFeedback || t.setDefaultSchedule}
          >
            <Clock3 size={16} />
            <span className="hidden sm:inline">{defaultScheduleFeedback || t.setDefaultSchedule}</span>
          </button>
          <button
            onClick={() => setCloseWeekModal({ confirmed: false, mode: viewedWeekClosing ? "reopen" : "close" })}
            className="flex items-center gap-1.5 px-3 py-2 rounded-lg text-sm font-medium transition"
            style={{ background: viewedWeekClosing ? "#495A78" : "#F59F00", color: "#FFFFFF", cursor: "pointer" }}
          >
            <Check size={16} />
            <span className="hidden sm:inline">{viewedWeekClosing ? t.reopenWeek : t.closeWeek}</span>
          </button>
          <button
            onClick={() => setPayrollOpen(true)}
            className="flex items-center gap-1.5 px-3 py-2 rounded-lg text-sm font-medium hover:opacity-80 transition"
            style={{ background: "#12B886", color: "#FFFFFF" }}
            title={t.payrollTitle}
          >
            <Wallet size={16} />
            <span className="hidden sm:inline">{t.payroll}</span>
          </button>
          <button
            onClick={() => {
              setSyncConfigText("");
              setSyncCodeInput(syncCfg?.syncCode || "");

          </div>
        </div>
      )}

      {closeWeekModal && (
        <div
          className="fixed inset-0 flex items-center justify-center z-50 p-4"
          style={{ background: "rgba(27,42,74,0.52)" }}
          onClick={() => setCloseWeekModal(null)}
        >
          <div className="w-full max-w-md rounded-xl p-5 shadow-xl" style={{ background: "#FFFFFF" }} onClick={(e) => e.stopPropagation()}>
            <div className="flex items-center justify-between mb-3">
              <h2 className="text-base font-semibold flex items-center gap-2"><Wallet size={17} /> {closeWeekModal.mode === "reopen" ? t.reopenWeekTitle : t.closeWeekTitle}</h2>
              <button onClick={() => setCloseWeekModal(null)} style={{ color: "#6B7A99" }}><X size={18} /></button>
            </div>
            <div className="text-xs mb-4" style={{ color: "#6B7A99" }}>
              {viewWeekKey} → {viewWeekEnd}. {closeWeekModal.mode === "reopen" ? t.reopenWeekHelp : t.closeWeekHelp}
            </div>
            <div className="grid grid-cols-3 gap-2 mb-4">
              <div className="rounded-lg p-3" style={{ background: "#F3F5F7" }}>
                <div className="text-[11px]" style={{ color: "#6B7A99" }}>{t.classSessions}</div>
                <div className="text-lg font-semibold mt-1">{viewWeekSummary.sessions}</div>
              </div>
              <div className="rounded-lg p-3" style={{ background: "#F3F5F7" }}>
                <div className="text-[11px]" style={{ color: "#6B7A99" }}>{t.classHours}</div>
                <div className="text-lg font-semibold mt-1">{formatHours(viewWeekSummary.minutes, lang)}</div>
              </div>
              <div className="rounded-lg p-3" style={{ background: "#E4FBF3" }}>
                <div className="text-[11px]" style={{ color: "#087F5B" }}>{t.taughtAmount}</div>
                <div className="text-sm font-semibold mt-1" style={{ color: "#087F5B" }}>{formatMoney(viewWeekSummary.amount, lang)}</div>
              </div>
            </div>
            <label className="flex items-start gap-2.5 p-3 rounded-lg border cursor-pointer" style={{ borderColor: closeWeekModal.confirmed ? "#12B886" : "#DDE3E8", background: closeWeekModal.confirmed ? "#E4FBF3" : "#FFFFFF" }}>
              <input
                type="checkbox"
                checked={closeWeekModal.confirmed}
                onChange={(e) => setCloseWeekModal({ ...closeWeekModal, confirmed: e.target.checked })}
                className="mt-0.5 w-4 h-4 accent-emerald-600"
              />
              <span className="text-sm">{closeWeekModal.mode === "reopen" ? t.reopenWeekText : t.closeWeekText}</span>
            </label>
            <div className="flex justify-end gap-2 mt-5">
              <button onClick={() => setCloseWeekModal(null)} className="px-3 py-2 rounded-lg text-sm" style={{ background: "#F3F5F7" }}>{t.cancel}</button>
              <button
                disabled={!closeWeekModal.confirmed}
                onClick={finishCloseWeek}
                className="px-4 py-2 rounded-lg text-sm text-white font-medium"
                style={{ background: closeWeekModal.confirmed ? "#F59F00" : "#B7C2D0", cursor: closeWeekModal.confirmed ? "pointer" : "not-allowed" }}
              >{closeWeekModal.mode === "reopen" ? t.reopenWeek : t.closeWeek}</button>
            </div>
          </div>
        </div>
      )}

      {attendanceConfirm && (
        <div
          className="fixed inset-0 flex items-center justify-center z-50 p-4"
          style={{ background: "rgba(27,42,74,0.5)" }}
          onClick={() => setAttendanceConfirm(null)}
        >
          <div
            className="w-full max-w-lg rounded-xl p-5 shadow-xl overflow-y-auto"
            style={{ background: "#FFFFFF", maxHeight: "90vh" }}
            onClick={(e) => e.stopPropagation()}
          >
            <div className="flex items-center justify-between mb-3">
              <h2 className="text-base font-semibold flex items-center gap-2"><Check size={17} /> {t.attendanceByStudent}</h2>
              <button onClick={() => setAttendanceConfirm(null)} style={{ color: "#6B7A99" }}><X size={18} /></button>
            </div>
            <div className="rounded-lg p-3 mb-4" style={{ background: "#F3F5F7" }}>
              <div className="text-sm font-semibold">{attendanceConfirm.session.note || t.editSession}</div>
              <div className="text-xs mt-1" style={{ color: "#6B7A99" }}>
                {attendanceConfirm.key.split("|")[0]} · {fmtTime(attendanceConfirm.session.start)}–{fmtTime(attendanceConfirm.session.start + attendanceConfirm.session.duration)}
              </div>
            </div>
            {attendanceConfirm.error && (
              <div className="text-xs px-3 py-2 rounded-lg mb-3" style={{ background: "#FFECEC", color: "#E03131" }}>{attendanceConfirm.error}</div>
            )}
            <div className="flex flex-col gap-2 mb-4">
              {attendanceConfirm.members.map((member) => {
                const status = attendanceConfirm.statuses[member.id] || "planned";
                const pricing = pricingForStudent(attendanceConfirm.session, member);
                return (
                  <div key={member.id} className="border rounded-lg p-3" style={{ borderColor: "#DDE3E8" }}>
                    <div className="flex items-center justify-between gap-2 mb-2">
                      <span className="text-sm font-medium">{member.name}</span>
                      <span className="text-xs" style={{ color: "#6B7A99" }}>{formatMoney(pricing.amount, lang)}/{pricing.mode === "fixed" ? (lang === "vi" ? "buổi" : "lesson") : (lang === "vi" ? "giờ" : "hour")}</span>
                    </div>
                    <div className="grid grid-cols-3 gap-1.5">
                      {[
                        ["completed", t.completed, "#12B886", "#E4FBF3"],
                        ["planned", t.planned, "#6B7A99", "#F3F5F7"],
                        ["cancelled", t.cancelled, "#E03131", "#FFECEC"],
                      ].map(([value, label, color, soft]) => (
                        <button
                          key={value}
                          onClick={() => setAttendanceConfirm({
                            ...attendanceConfirm,
                            statuses: { ...attendanceConfirm.statuses, [member.id]: value },
                          })}
                          className="px-2 py-1.5 rounded-md text-xs font-medium"
                          style={{ background: status === value ? color : soft, color: status === value ? "#FFFFFF" : color }}
                        >{label}</button>
                      ))}
                    </div>
                  </div>
                );
              })}
            </div>
            <div className="flex justify-end gap-2 mt-5">
              <button onClick={() => setAttendanceConfirm(null)} className="px-3 py-2 rounded-lg text-sm" style={{ background: "#F3F5F7" }}>{t.cancel}</button>
              <button
                onClick={() => {
                  const latestStatuses = Object.fromEntries(attendanceConfirm.members.map((member) => {
                    const memberKey = `${attendanceConfirm.key}|${member.id}`;
                    return [member.id, lessonRecords[memberKey]?.status || attendance[memberKey] || "planned"];
                  }));
                  if (attendanceConfirm.originalStatuses && attendanceConfirm.members.some((member) =>
                    latestStatuses[member.id] !== attendanceConfirm.originalStatuses[member.id]
                  )) {
                    setAttendanceConfirm({
                      ...attendanceConfirm,
                      statuses: latestStatuses,
                      originalStatuses: latestStatuses,
                      error: t.conflictError,
                    });
                    return;
                  }
                  attendanceConfirm.members.forEach((member) => {
                    updateLessonStatus(
                      `${attendanceConfirm.key}|${member.id}`,
                      { ...attendanceConfirm.session, studentId: member.id },
                      member,
                      attendanceConfirm.statuses[member.id] || "planned"
                    );
                  });
                  setAttendanceConfirm(null);
                }}
                className="px-4 py-2 rounded-lg text-sm text-white font-medium transition"
                style={{ background: "#12B886", cursor: "pointer" }}
              >
                {t.confirmAction}
              </button>
            </div>
          </div>
        </div>
      )}

      {studentModal && (
        <div
          className="fixed inset-0 flex items-center justify-center z-50 p-4"
          style={{ background: "rgba(27,42,74,0.45)" }}
          onClick={() => setStudentModal(null)}
        >
          <div className="w-full max-w-sm rounded-xl p-5 shadow-xl" style={{ background: "#FFFFFF" }} onClick={(e) => e.stopPropagation()}>
            <div className="flex items-center justify-between mb-4">
              <h2 className="text-base font-semibold flex items-center gap-2"><Pencil size={16} /> {t.editStudent}</h2>
              <button onClick={() => setStudentModal(null)} style={{ color: "#6B7A99" }}><X size={18} /></button>
            </div>
            {studentModal.error && (
              <div className="text-xs px-3 py-2 rounded-lg mb-3" style={{ background: "#FFECEC", color: "#E03131" }}>{studentModal.error}</div>
            )}
            <div className="flex flex-col gap-3">
              <div>
                <label className="text-xs font-medium" style={{ color: "#6B7A99" }}>{t.studentNamePlaceholder}</label>
                <input
                  value={studentModal.name}
                  onChange={(e) => setStudentModal({ ...studentModal, name: e.target.value })}
                  className="w-full mt-1.5 px-3 py-2 rounded-lg text-sm border outline-none"
                  style={{ borderColor: "#DDE3E8" }}
                />
              </div>
              <div>
                <label className="text-xs font-medium" style={{ color: "#6B7A99" }}>{t.hourlyRate}</label>
                <input
                  type="number"
                  min="0"
                  step="10000"
                  value={studentModal.hourlyRate}
                  onChange={(e) => setStudentModal({ ...studentModal, hourlyRate: e.target.value })}
                  className="w-full mt-1.5 px-3 py-2 rounded-lg text-sm border outline-none"
                  style={{ borderColor: "#DDE3E8" }}
                />
              </div>
              <div>
                <label className="text-xs font-medium" style={{ color: "#6B7A99" }}>{t.studentColor}</label>
                <div className="flex flex-wrap gap-2 mt-2">
                  {STUDENT_COLORS.map((color, index) => (
                    <button
                      key={index}
                      type="button"
                      onClick={() => setStudentModal({ ...studentModal, color: index })}
                      className="w-7 h-7 rounded-full flex items-center justify-center transition"
                      style={{ background: color.bg, boxShadow: studentModal.color === index ? `0 0 0 3px #FFFFFF, 0 0 0 5px ${color.bg}` : "none" }}
                      aria-label={`${t.studentColor} ${index + 1}`}
                    >
                      {studentModal.color === index && <Check size={14} style={{ color: "#FFFFFF" }} />}
                    </button>
                  ))}
                </div>
              </div>
            </div>
            <div className="flex justify-end gap-2 mt-5">
              <button onClick={() => setStudentModal(null)} className="px-3 py-2 rounded-lg text-sm" style={{ background: "#F3F5F7" }}>{t.cancel}</button>
              <button onClick={saveStudentModal} className="px-4 py-2 rounded-lg text-sm text-white font-medium" style={{ background: "#1B2A4A" }}>{t.save}</button>
            </div>
          </div>
        </div>
      )}

      {payrollOpen && (
        <div
          className="fixed inset-0 flex items-center justify-center z-50 p-3 sm:p-6"
          style={{ background: "rgba(27,42,74,0.55)" }}
          onClick={() => setPayrollOpen(false)}
        >
          <div
            className="w-full max-w-5xl rounded-xl shadow-xl flex flex-col overflow-hidden"
            style={{ background: "#FFFFFF", maxHeight: "92vh" }}
            onClick={(e) => e.stopPropagation()}
          >
            <div className="p-4 sm:p-5 border-b flex items-center justify-between gap-3" style={{ borderColor: "#DDE3E8" }}>
              <div>
                <h2 className="text-lg font-semibold flex items-center gap-2"><Wallet size={18} /> {t.payrollTitle}</h2>
                <div className="text-xs mt-1" style={{ color: "#6B7A99" }}>{t.completed}: {payrollOccurrences.filter((x) => x.status === "completed").length} / {payrollOccurrences.length}</div>
              </div>
              <div className="flex items-center gap-2">
                <input
                  type="month"
                  value={payrollMonth}
                  onChange={(e) => setPayrollMonth(e.target.value)}
                  className="px-3 py-2 rounded-lg text-sm border font-medium"
                  style={{ borderColor: "#DDE3E8" }}
                />
                <button onClick={() => setPayrollOpen(false)} style={{ color: "#6B7A99" }}><X size={20} /></button>
              </div>
            </div>

            <div className="overflow-y-auto p-4 sm:p-5">
              <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-5">
                <div className="rounded-lg p-3" style={{ background: "#F3F5F7" }}>
                  <div className="text-xs" style={{ color: "#6B7A99" }}>{t.attendanceCount}</div>
                  <div className="text-xl font-semibold mt-1">{payrollRows.reduce((sum, row) => sum + row.sessions, 0)}</div>
                </div>
                <div className="rounded-lg p-3" style={{ background: "#F3F5F7" }}>
                  <div className="text-xs" style={{ color: "#6B7A99" }}>{t.billableHours}</div>
                  <div className="text-xl font-semibold mt-1">{formatHours(payrollRows.reduce((sum, row) => sum + row.minutes, 0), lang)}</div>
                </div>
                <div className="rounded-lg p-3" style={{ background: "#E4FBF3" }}>
                  <div className="text-xs" style={{ color: "#087F5B" }}>{t.totalAmount}</div>
                  <div className="text-xl font-semibold mt-1" style={{ color: "#087F5B" }}>{formatMoney(payrollTotal, lang)}</div>
                </div>
              </div>

              {payrollRows.length > 0 && (
                <div className="overflow-x-auto border rounded-lg mb-5" style={{ borderColor: "#DDE3E8" }}>
                  <table className="w-full text-sm">
                    <thead style={{ background: "#F3F5F7", color: "#6B7A99" }}>
                      <tr><th className="text-left px-3 py-2">{t.students}</th><th className="text-right px-3 py-2">{t.attendanceCount}</th><th className="text-right px-3 py-2">{t.billableHours}</th><th className="text-right px-3 py-2">{t.lessonPrice}</th><th className="text-right px-3 py-2">{t.totalAmount}</th></tr>
                    </thead>
                    <tbody>
                      {payrollRows.map((row) => (
                        <tr key={row.student.id} className="border-t" style={{ borderColor: "#DDE3E8" }}>
                          <td className="px-3 py-2 font-medium">{row.student.name}</td>
                          <td className="px-3 py-2 text-right">{row.sessions}</td>
                          <td className="px-3 py-2 text-right">{formatHours(row.minutes, lang)}</td>
                          <td className="px-3 py-2 text-right">{row.priceDescription
                            ? `${formatMoney(Number(row.priceDescription.split("|")[1]), lang)}/${row.priceDescription.startsWith("fixed|") ? (lang === "vi" ? "buổi" : "lesson") : (lang === "vi" ? "giờ" : "hour")}`
                            : "—"}</td>
                          <td className="px-3 py-2 text-right font-semibold">{formatMoney(row.amount, lang)}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              )}

              {attendanceDetailRows.length > 0 && (
                <div className="mb-5">
                  <h3 className="text-sm font-semibold mb-2">{t.attendanceDetails}</h3>
                  <div className="grid grid-cols-1 lg:grid-cols-2 gap-2">
                    {attendanceDetailRows.map((row) => (
                      <div key={row.student.id} className="border rounded-lg p-3" style={{ borderColor: "#DDE3E8" }}>
                        <div className="text-sm font-semibold mb-2">{row.student.name}</div>
                        <div className="text-xs mb-1" style={{ color: "#087F5B" }}>{t.attendedDates}: {row.attended.length || 0}</div>
                        {row.attended.map((item) => (
                          <div key={`attended-${item.key}`} className="text-xs ml-2 mb-0.5">
                            {item.date.toLocaleDateString(lang === "vi" ? "vi-VN" : "en-US")} · {fmtTime(item.session.start)}–{fmtTime(item.session.start + item.session.duration)} · {item.session.note || "—"}
                          </div>
                        ))}
                        <div className="text-xs mt-2 mb-1" style={{ color: "#E03131" }}>{t.absentDates}: {row.absent.length || 0}</div>
                        {row.absent.map((item) => (
                          <div key={`absent-${item.key}`} className="text-xs ml-2 mb-0.5">
                            {item.date.toLocaleDateString(lang === "vi" ? "vi-VN" : "en-US")} · {fmtTime(item.session.start)}–{fmtTime(item.session.start + item.session.duration)} · {item.session.note || "—"}
                          </div>
                        ))}
                      </div>
                    ))}
                  </div>
                </div>
              )}

              <div className="flex flex-col gap-2">
                {payrollOccurrences.length === 0 && <div className="text-sm text-center py-8" style={{ color: "#6B7A99" }}>{t.noLessons}</div>}
                {payrollOccurrences.map((item) => (
                  <div key={item.key} className="border rounded-lg p-3 flex flex-col sm:flex-row sm:items-center gap-3" style={{ borderColor: "#DDE3E8" }}>
                    <div className="sm:w-36 shrink-0">
                      <div className="text-sm font-semibold">{item.date.toLocaleDateString(lang === "vi" ? "vi-VN" : "en-US")}</div>
                      <div className="text-xs font-mono" style={{ color: "#6B7A99" }}>{fmtTime(item.session.start)}–{fmtTime(item.session.start + item.session.duration)}</div>
                    </div>
                    <div className="flex-1 min-w-0">
                      <div className="text-sm font-medium truncate">{item.student?.name || "?"}</div>
                      <div className="text-xs truncate" style={{ color: "#6B7A99" }}>{item.session.note || `${item.session.duration} ${lang === "vi" ? "phút" : "min"}`} · {formatMoney(calculatedLessonFee(item.session, item.student), lang)}</div>
                      {item.session.details && <div className="text-xs mt-1" style={{ color: "#8896AC" }}>{item.session.details}</div>}
                    </div>
                    <div className="flex gap-1.5 shrink-0">
                      {[
                        ["completed", t.completed, "#12B886", "#E4FBF3"],
                        ["planned", t.planned, "#6B7A99", "#F3F5F7"],
                        ["cancelled", t.cancelled, "#E03131", "#FFECEC"],
                      ].map(([status, label, color, soft]) => (
                        <button
                          key={status}
                          disabled={Boolean(weeklyClosings[weekKeyForDateString(dateKey(item.date))])}
                          onClick={() => updateLessonStatus(item.key, item.session, item.student, status)}
                          className="px-2.5 py-1.5 rounded-md text-xs font-medium flex items-center gap-1"
                          style={{
                            background: item.status === status ? color : soft,
                            color: item.status === status ? "#FFFFFF" : color,
                            opacity: weeklyClosings[weekKeyForDateString(dateKey(item.date))] ? 0.5 : 1,
                            cursor: weeklyClosings[weekKeyForDateString(dateKey(item.date))] ? "not-allowed" : "pointer",
                          }}
                        >
                          {status === "completed" && <Check size={12} />} {label}
                        </button>
                      ))}
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </div>
        </div>
      )}

      {syncModalOpen && (
        <div
          className="fixed inset-0 flex items-center justify-center z-50 p-4"
          style={{ background: "rgba(27,42,74,0.45)" }}
          onClick={() => setSyncModalOpen(false)}
        >
          <div
            className="w-full max-w-sm rounded-xl p-5 shadow-xl"
            style={{ background: "#FFFFFF" }}
            onClick={(e) => e.stopPropagation()}
          >
            <div className="flex items-center justify-between mb-3">
              <h2 className="text-base font-semibold flex items-center gap-1.5">
                <Cloud size={16} /> {t.syncTitle}
              </h2>
              <button onClick={() => setSyncModalOpen(false)} style={{ color: "#6B7A99" }}>
                <X size={18} />
              </button>
            </div>

            <p className="text-xs mb-3" style={{ color: "#6B7A99" }}>
              {t.syncIntro}
            </p>

            {syncCfg ? (
              <div className="flex flex-col gap-3">
                <div>
                  <label className="text-xs font-medium" style={{ color: "#6B7A99" }}>
                    {t.syncedAs}
                  </label>
                  <div
                    className="mt-1.5 px-3 py-2 rounded-lg text-sm font-mono"
                    style={{ background: "#F3F5F7" }}
                  >
                    {syncCfg.syncCode}
                  </div>
                </div>
                <button
                  onClick={copySyncLink}
                  className="px-3 py-2 rounded-lg text-sm text-white font-medium"
                  style={{ background: "#1B2A4A" }}
                >
                  {t.copyLink}
                </button>
                {copyFeedback && (
                  <div className="text-xs break-all" style={{ color: "#6B7A99" }}>
                    {copyFeedback}
                  </div>
                )}
                <p className="text-xs" style={{ color: "#6B7A99" }}>
                  {t.syncHelp}
                </p>
                <button
                  onClick={disconnectSync}
                  className="px-3 py-2 rounded-lg text-sm"
                  style={{ background: "#FFECEC", color: "#E03131" }}
                >
                  {t.disconnect}
                </button>
              </div>
            ) : (
              <div className="flex flex-col gap-3">
                <div>
                  <label className="text-xs font-medium" style={{ color: "#6B7A99" }}>
                    {t.syncConfigLabel}
                  </label>
                  <textarea
                    value={syncConfigText}
                    onChange={(e) => setSyncConfigText(e.target.value)}
                    placeholder={t.syncConfigPlaceholder}
                    rows={6}
                    className="w-full mt-1.5 px-3 py-2 rounded-lg text-xs font-mono border outline-none"
                    style={{ borderColor: "#DDE3E8" }}
                  />
                </div>
                <div>
                  <label className="text-xs font-medium" style={{ color: "#6B7A99" }}>
                    {t.syncCodeLabel}
                  </label>
                  <input
                    value={syncCodeInput}
                    onChange={(e) => setSyncCodeInput(e.target.value)}
                    placeholder={t.syncCodePlaceholder}
                    className="w-full mt-1.5 px-3 py-2 rounded-lg text-sm border outline-none"
                    style={{ borderColor: "#DDE3E8" }}
                  />
                </div>
                {syncInputError && (
                  <div className="text-xs px-3 py-2 rounded-lg" style={{ background: "#FFECEC", color: "#E03131" }}>
                    {syncInputError}
                  </div>
                )}
                <button
                  onClick={connectSync}
                  className="px-3 py-2 rounded-lg text-sm text-white font-medium"
                  style={{ background: "#1B2A4A" }}
                >
                  {t.connect}
                </button>
              </div>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
