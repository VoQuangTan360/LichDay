function fmtTime(mins) {
  const h = Math.floor(mins / 60) % 24;
  const m = mins % 60;
  return `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}`;
}
function clamp(v, lo, hi) {
  return Math.max(lo, Math.min(hi, v));
}
function dateKey(date) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, "0");
  const d = String(date.getDate()).padStart(2, "0");
  return `${y}-${m}-${d}`;
}
function currentMonthKey() {
  return dateKey(new Date()).slice(0, 7);
}
function startOfWeek(date) {
  const result = new Date(date);
  const dayIndex = (result.getDay() + 6) % 7;
  result.setHours(0, 0, 0, 0);
  result.setDate(result.getDate() - dayIndex);
  return result;
}
function weekKeyForDateString(value) {
  return dateKey(startOfWeek(new Date(`${value}T00:00:00`)));
}
function formatMoney(value, lang = "vi") {
  return new Intl.NumberFormat(lang === "vi" ? "vi-VN" : "en-US", {
    style: "currency",
    currency: "VND",
    maximumFractionDigits: 0,
  }).format(Math.round(value || 0));
}

const STORAGE_KEY = "tutor_schedule_v1";
function loadSaved() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {
    console.warn("Could not read saved schedule:", e);
  }
  return null;

const savedData = loadSaved();

function lessonRecordFromTemplate(key, session, student, status) {
  const lessonDate = key.split("|")[0];
  const hourlyRate = Number(student?.hourlyRate) || 0;
  return {
    key,
    date: lessonDate,
    sessionId: session.id,
    studentId: session.studentId,
    studentName: student?.name || "?",
    start: session.start,
    duration: session.duration,
    note: session.note || "",
    hourlyRate,
    amount: status === "completed" ? (session.duration / 60) * hourlyRate : 0,
    status,
  };
}

function migrateLegacyAttendance(attendance, sessions, students) {
  const records = {};
  Object.entries(attendance || {}).forEach(([key, status]) => {
    if (status === "planned") return;
    const sessionId = key.split("|")[1];
    const session = (sessions || []).find((item) => item.id === sessionId);
    if (!session) return;
    const student = (students || []).find((item) => item.id === session.studentId);
    records[key] = lessonRecordFromTemplate(key, session, student, status);
  });
  return records;
}

// ---------- Cloud sync (optional, via the user's own Firebase project) ----------
const SYNC_CFG_KEY = "tutor_schedule_sync_cfg";
function loadSyncCfg() {
  try {
    const raw = localStorage.getItem(SYNC_CFG_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return null;
}
function readSyncCfgFromHash() {
  const h = window.location.hash;
  if (!h.startsWith("#sync=")) return null;
  try {
    const json = decodeURIComponent(escape(atob(h.slice(6))));
    const parsed = JSON.parse(json);
    if (parsed && parsed.apiKey && parsed.projectId && parsed.syncCode) return parsed;
  } catch (e) {}
  return null;
}
function randomSyncCode() {
  return Math.random().toString(36).slice(2, 8) + Math.random().toString(36).slice(2, 6);
}

function App() {
  const [lang, setLang] = useState(savedData?.lang || "en");

  const [closeWeekModal, setCloseWeekModal] = useState(null);
  const [attendance, setAttendance] = useState(savedData?.attendance || {});
  const [lessonRecords, setLessonRecords] = useState(() =>
    savedData?.lessonRecords ||
    migrateLegacyAttendance(savedData?.attendance, savedData?.sessions || seedSessions, savedData?.students || seedStudents)
  );
  const [payrollOpen, setPayrollOpen] = useState(false);
  const [payrollMonth, setPayrollMonth] = useState(currentMonthKey());
  const [attendanceConfirm, setAttendanceConfirm] = useState(null);

  const [syncCfg, setSyncCfg] = useState(() => readSyncCfgFromHash() || loadSyncCfg());
  const [syncStatus, setSyncStatus] = useState("offline"); // offline | connecting | synced | error
  const [syncModalOpen, setSyncModalOpen] = useState(false);
  const [syncConfigText, setSyncConfigText] = useState("");
  const [syncCodeInput, setSyncCodeInput] = useState("");
  const [copyFeedback, setCopyFeedback] = useState("");

  const gridRef = useRef(null);
  const scrollRef = useRef(null);
  const dragState = useRef(null);
  const suppressSessionEditRef = useRef(false);
  const dbRef = useRef(null);
  const unsubRef = useRef(null);
  const applyingRemoteRef = useRef(false);
  const pushTimerRef = useRef(null);

  useEffect(() => {
    const t2 = setInterval(() => setNow(new Date()), 60000);
    return () => clearInterval(t2);
  }, []);

  // persist config to localStorage + clean the URL hash once read
  useEffect(() => {
    if (readSyncCfgFromHash() && window.history?.replaceState) {
      window.history.replaceState(null, "", window.location.pathname + window.location.search);
    }
    if (syncCfg) {
      try {
        localStorage.setItem(SYNC_CFG_KEY, JSON.stringify(syncCfg));
      } catch (e) {}
    } else {
      try {
        localStorage.removeItem(SYNC_CFG_KEY);
      } catch (e) {}
    }
    // eslint-disable-next-line
  }, [syncCfg]);

  // connect to Firestore whenever syncCfg changes
  useEffect(() => {
    if (unsubRef.current) {
      unsubRef.current();
      unsubRef.current = null;
    }
    if (!syncCfg || !syncCfg.apiKey || !syncCfg.projectId || !syncCfg.syncCode) {
      dbRef.current = null;
      setSyncStatus("offline");
      return;
    }
    setSyncStatus("connecting");
    try {
      const appName = "tutor-schedule";
      const existing = firebase.apps.find((a) => a.name === appName);
      const fbApp = existing || firebase.initializeApp(syncCfg, appName);
      const db = firebase.firestore(fbApp);
      dbRef.current = db;
      const docRef = db.collection("schedules").doc(syncCfg.syncCode);
      unsubRef.current = docRef.onSnapshot(
        (snap) => {
          setSyncStatus("synced");
          if (snap.exists) {
            const data = snap.data();
            applyingRemoteRef.current = true;
            if (data.students) setStudents(data.students);
            if (data.sessions) setSessions(data.sessions.map((session) => ({ effectiveFrom: "1970-01-01", ...session })));
            if (data.attendance) setAttendance(data.attendance);
            if (data.lessonRecords) {
              setLessonRecords(data.lessonRecords);
            } else if (data.attendance) {
              setLessonRecords(migrateLegacyAttendance(data.attendance, data.sessions || sessions, data.students || students));
            }
            if (data.weeklyClosings) setWeeklyClosings(data.weeklyClosings);
            if (data.lang) setLang(data.lang);
            if (data.rowHeight) setRowHeight(data.rowHeight);
          } else {
            docRef.set({ students, sessions, attendance, lessonRecords, weeklyClosings, lang, rowHeight, updatedAt: Date.now() });
          }
        },
        (err) => {
          console.warn("Sync error:", err);
          setSyncStatus("error");
        }
      );
    } catch (e) {
      console.warn("Could not connect sync:", e);
      setSyncStatus("error");
    }
    return () => {
      if (unsubRef.current) unsubRef.current();
    };
    // eslint-disable-next-line
  }, [syncCfg?.apiKey, syncCfg?.projectId, syncCfg?.syncCode]);

  // save locally always; push to cloud (debounced) unless the change just arrived from the cloud
  useEffect(() => {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ students, sessions, attendance, lessonRecords, weeklyClosings, lang, rowHeight }));
    } catch (e) {
      console.warn("Could not save schedule:", e);
    }
    if (applyingRemoteRef.current) {
      applyingRemoteRef.current = false;
      return;
    }
    if (dbRef.current && syncCfg?.syncCode) {
      if (pushTimerRef.current) clearTimeout(pushTimerRef.current);
      pushTimerRef.current = setTimeout(() => {
        dbRef.current
          .collection("schedules")
          .doc(syncCfg.syncCode)
          .set({ students, sessions, attendance, lessonRecords, weeklyClosings, lang, rowHeight, updatedAt: Date.now() }, { merge: true })
          .catch((e) => {
            console.warn("Push failed:", e);
            setSyncStatus("error");
          });
      }, 500);
    }
  }, [students, sessions, attendance, lessonRecords, weeklyClosings, lang, rowHeight]);

  function connectSync() {
    try {
      const cfg = JSON.parse(
        syncConfigText
          .replace(/([{,]\s*)([A-Za-z_$][\w$]*)\s*:/g, '$1"$2":')
          .replace(/'/g, '"')
      );
      const code = syncCodeInput.trim() || randomSyncCode();
      setSyncCfg({ ...cfg, syncCode: code });
      setSyncModalOpen(false);
    } catch (e) {
      alert(lang === "vi" ? "Cấu hình Firebase không hợp lệ." : "Invalid Firebase config.");
    }
  }

  function disconnectSync() {
    setSyncCfg(null);
    setSyncModalOpen(false);
  }

  function copySyncLink() {
    if (!syncCfg) return;
    const b64 = btoa(unescape(encodeURIComponent(JSON.stringify(syncCfg))));
    const link = window.location.origin + window.location.pathname + "#sync=" + b64;
    if (navigator.clipboard?.writeText) {
      navigator.clipboard
        .writeText(link)
        .then(() => setCopyFeedback(lang === "vi" ? "Đã sao chép!" : "Copied!"))
        .catch(() => setCopyFeedback(link));
    } else {
      setCopyFeedback(link);
    }
    setTimeout(() => setCopyFeedback(""), 4000);
  }

  const nextColor = students.length % STUDENT_COLORS.length;

  function addStudent() {
    const name = newStudentName.trim();
    if (!name) return;
    setStudents((prev) => [
      ...prev,
      { id: uid(), name, color: prev.length % STUDENT_COLORS.length, hourlyRate: Math.max(0, Number(newStudentRate) || 0) },
    ]);
    setNewStudentName("");
    setNewStudentRate(200000);
    setAddingStudent(false);
  }

  function saveStudentModal() {
    const name = studentModal.name.trim();
    if (!name) return;
    setStudents((prev) =>
      prev.map((s) =>
        s.id === studentModal.id
          ? { ...s, name, hourlyRate: Math.max(0, Number(studentModal.hourlyRate) || 0), color: studentModal.color }
          : s
      )
    );
    setStudentModal(null);
  }

  function removeStudent(id) {
    setStudents((prev) => prev.filter((s) => s.id !== id));
    setSessions((prev) => prev.filter((s) => s.studentId !== id));
    if (filterId === id) setFilterId(null);
    setConfirmDeleteStudent(null);
  }

  function openAddModal(day, startMin) {
    if (students.length === 0) {
      setAddingStudent(true);
      return;
    }
    setModal({
      mode: "add",
      studentId: filterId || students[0].id,
      day,
      start: clamp(Math.round(startMin / SNAP) * SNAP, START_MIN, END_MIN - 30),
      duration: 60,
      note: "",
    });
  }

  function openEditModal(session) {
    setModal({ mode: "edit", id: session.id, ...session });
  }

  function saveModal() {
    if (modal.start + modal.duration > END_MIN) return;
    if (modal.mode === "add") {
      setSessions((prev) => [
        ...prev,
        {
          id: uid(),
          studentId: modal.studentId,
          day: modal.day,
          start: modal.start,
          duration: modal.duration,
          note: modal.note,
          effectiveFrom: dateKey(new Date()),
        },
      ]);
    } else {
      setSessions((prev) =>
        prev.map((s) =>
          s.id === modal.id
            ? { ...s, studentId: modal.studentId, day: modal.day, start: modal.start, duration: modal.duration, note: modal.note }
            : s
        )
      );
    }
    setModal(null);
  }

  function deleteModalSession() {
    setSessions((prev) => prev.filter((s) => s.id !== modal.id));
    setModal(null);
  }

  const onSessionMouseDown = useCallback(
    (e, session) => {
      e.stopPropagation();
      if (e.button !== 0) return;
      const rect = gridRef.current.getBoundingClientRect();
      dragState.current = {
        id: session.id,
        moved: false,
        startX: e.clientX,
        startY: e.clientY,
        origDay: session.day,
        origStart: session.start,
        rect,
        colWidth: rect.width / 7,
      };
      window.addEventListener("mousemove", onDragMove);
      window.addEventListener("mouseup", onDragUp);
    },
    [rowHeight]
  );

  const onDragMove = useCallback(
    (e) => {
      const ds = dragState.current;
      if (!ds) return;
      const dx = e.clientX - ds.startX;
      const dy = e.clientY - ds.startY;
      if (!ds.moved && Math.abs(dx) < 4 && Math.abs(dy) < 4) return;
      ds.moved = true;
      suppressSessionEditRef.current = true;

      const deltaMinutes = (dy / rowHeight) * 60;
      let newStart = Math.round((ds.origStart + deltaMinutes) / SNAP) * SNAP;
      newStart = clamp(newStart, START_MIN, END_MIN - 15);

      const dayIndex = clamp(Math.floor((e.clientX - ds.rect.left) / ds.colWidth), 0, 6);

      setSessions((prev) =>
        prev.map((s) =>
          s.id === ds.id
            ? { ...s, day: dayIndex, start: clamp(newStart, START_MIN, END_MIN - s.duration) }
            : s
        )
      );
    },
    [rowHeight]
  );

  const onDragUp = useCallback(() => {
    const wasMoved = Boolean(dragState.current?.moved);
    window.removeEventListener("mousemove", onDragMove);
    window.removeEventListener("mouseup", onDragUp);
    dragState.current = null;
    if (wasMoved) {
      window.setTimeout(() => {
        suppressSessionEditRef.current = false;
      }, 500);
    }
  }, [onDragMove]);

  const resizeState = useRef(null);
  const onResizeMouseDown = useCallback(
    (e, session) => {
      e.stopPropagation();
      e.preventDefault();
      resizeState.current = { id: session.id, startY: e.clientY, origDuration: session.duration };
      window.addEventListener("mousemove", onResizeMove);
      window.addEventListener("mouseup", onResizeUp);
    },
    [rowHeight]
  );
  const onResizeMove = useCallback(
    (e) => {
      const rs = resizeState.current;
      if (!rs) return;
      const dy = e.clientY - rs.startY;
      const deltaMinutes = (dy / rowHeight) * 60;
      let newDuration = Math.round((rs.origDuration + deltaMinutes) / SNAP) * SNAP;
      newDuration = clamp(newDuration, 15, END_MIN - START_MIN);
      setSessions((prev) =>
        prev.map((s) =>
          s.id === rs.id ? { ...s, duration: clamp(newDuration, 15, END_MIN - s.start) } : s
        )
      );
    },
    [rowHeight]
  );
  const onResizeUp = useCallback(() => {
    window.removeEventListener("mousemove", onResizeMove);
    window.removeEventListener("mouseup", onResizeUp);
    resizeState.current = null;
  }, [onResizeMove]);

  function onColumnClick(e, dayIndex) {
    if (dragState.current && dragState.current.moved) return;
    const rect = e.currentTarget.getBoundingClientRect();
    const y = e.clientY - rect.top;
    const minutes = START_MIN + (y / rowHeight) * 60;
    openAddModal(dayIndex, minutes);
  }

  const totalHeight = rowHeight * (END_HOUR - START_HOUR);
  const jsDay = now.getDay();
  const todayIndex = (jsDay + 6) % 7;
  const nowMinutes = now.getHours() * 60 + now.getMinutes();
  const mondayOfCurrentWeek = startOfWeek(now);
  const viewWeekKey = dateKey(viewWeekStart);
  const isCurrentWeek = viewWeekKey === dateKey(mondayOfCurrentWeek);
  const viewedWeekClosing = weeklyClosings[viewWeekKey];
  const viewWeekDates = Array.from({ length: 7 }, (_, index) => {
    const date = new Date(viewWeekStart);
    date.setDate(viewWeekStart.getDate() + index);
    return date;
  });
  function currentWeekOccurrenceKey(session) {
    const lessonDate = new Date(viewWeekStart);
    lessonDate.setDate(viewWeekStart.getDate() + session.day);
    return `${dateKey(lessonDate)}|${session.id}`;
  }

  const studentById = (id) => students.find((s) => s.id === id);
  const colorFor = (student) => STUDENT_COLORS[(student?.color ?? 0) % STUDENT_COLORS.length];

  const visibleSessions = sessions.filter((s) => !filterId || s.studentId === filterId);

  function updateLessonStatus(key, session, student, status) {
    if (weeklyClosings[weekKeyForDateString(key.slice(0, 10))]) return;
    setAttendance((prev) => ({ ...prev, [key]: status }));
    setLessonRecords((prev) => {
      if (status === "planned") {
        const next = { ...prev };
        delete next[key];
        return next;
      }
      return { ...prev, [key]: lessonRecordFromTemplate(key, session, student, status) };
    });
  }

  const viewWeekEnd = dateKey(viewWeekDates[6]);
  const viewWeekCompletedRecords = Object.values(lessonRecords).filter(
    (record) => record.date >= viewWeekKey && record.date <= viewWeekEnd && record.status === "completed"
  );
  const viewWeekSummary = {
    sessions: viewWeekCompletedRecords.length,
    minutes: viewWeekCompletedRecords.reduce((sum, record) => sum + record.duration, 0),
    amount: viewWeekCompletedRecords.reduce((sum, record) => sum + record.amount, 0),
  };

  function finishCloseWeek() {
    setWeeklyClosings((prev) => ({
      ...prev,
      [viewWeekKey]: {
        weekStart: viewWeekKey,
        weekEnd: viewWeekEnd,
        sessions: viewWeekSummary.sessions,
        minutes: viewWeekSummary.minutes,
        amount: viewWeekSummary.amount,
        closedAt: Date.now(),
      },
    }));
    setCloseWeekModal(null);
    setViewWeekStart((current) => {
      const next = new Date(current);
      next.setDate(current.getDate() + 7);
      return next;
    });
  }

  const [payrollYear, payrollMonthNumber] = payrollMonth.split("-").map(Number);
  const payrollOccurrences = [];
  const payrollOccurrenceKeys = new Set();
  function occurrenceFromRecord(record) {
    const student = students.find((item) => item.id === record.studentId) || {
      id: record.studentId,
      name: record.studentName,
      hourlyRate: record.hourlyRate,
    };
    return {
      key: record.key,
      date: new Date(`${record.date}T00:00:00`),
      session: {
        id: record.sessionId,
        studentId: record.studentId,
        start: record.start,
        duration: record.duration,
        note: record.note,
      },
      student: { ...student, name: record.studentName, hourlyRate: record.hourlyRate },
      status: record.status,
      amount: record.amount,
    };
  }
  if (payrollYear && payrollMonthNumber) {
    const daysInMonth = new Date(payrollYear, payrollMonthNumber, 0).getDate();
    for (let dayOfMonth = 1; dayOfMonth <= daysInMonth; dayOfMonth += 1) {
      const date = new Date(payrollYear, payrollMonthNumber - 1, dayOfMonth);
      const weekday = (date.getDay() + 6) % 7;
      const lessonDate = dateKey(date);
      sessions
        .filter((session) => session.day === weekday && lessonDate >= (session.effectiveFrom || "1970-01-01"))
        .forEach((session) => {
          const key = `${lessonDate}|${session.id}`;
          payrollOccurrenceKeys.add(key);
          const storedRecord = lessonRecords[key];
          if (storedRecord) {
            payrollOccurrences.push(occurrenceFromRecord(storedRecord));
            return;
          }
          const student = studentById(session.studentId);
          const status = attendance[key] || "planned";
          const amount = status === "completed" ? (session.duration / 60) * (Number(student?.hourlyRate) || 0) : 0;
          payrollOccurrences.push({ key, date, session, student, status, amount });
        });
    }
    Object.values(lessonRecords).forEach((record) => {
      if (record.date.slice(0, 7) === payrollMonth && !payrollOccurrenceKeys.has(record.key)) {
        payrollOccurrences.push(occurrenceFromRecord(record));
        payrollOccurrenceKeys.add(record.key);
      }
    });
  }
  payrollOccurrences.sort((a, b) => a.date - b.date || a.session.start - b.session.start);
  const payrollStudents = new Map(students.map((student) => [student.id, student]));
  Object.values(lessonRecords).forEach((record) => {
    if (!payrollStudents.has(record.studentId)) {
      payrollStudents.set(record.studentId, { id: record.studentId, name: record.studentName, hourlyRate: record.hourlyRate });
    }
  });
  const payrollRows = Array.from(payrollStudents.values()).map((student) => {
    const rows = payrollOccurrences.filter((item) => item.student?.id === student.id && item.status === "completed");
    const rates = [...new Set(rows.map((item) => Number(item.student?.hourlyRate) || 0))];
    return {
      student,
      sessions: rows.length,
      minutes: rows.reduce((sum, item) => sum + item.session.duration, 0),
      amount: rows.reduce((sum, item) => sum + item.amount, 0),
      hourlyRate: rates.length === 1 ? rates[0] : null,
    };
  }).filter((row) => row.sessions > 0);
  const payrollTotal = payrollRows.reduce((sum, row) => sum + row.amount, 0);

  return (
    <div
      className="w-full min-h-screen flex flex-col"
      style={{ background: "#F3F5F7", color: "#16213E" }}
    >
      <div className="px-6 pt-6 pb-4 flex items-center justify-between flex-wrap gap-3" style={{ background: "#1B2A4A" }}>
        <div>
          <h1 className="text-xl font-semibold tracking-tight" style={{ color: "#F3F5F7" }}>
            {t.title}
          </h1>
          <p className="text-sm mt-0.5" style={{ color: "#8FA0C2" }}>
            {t.subtitle}
          </p>
        </div>
        <div className="flex items-center gap-2">
          <div className="flex items-center rounded-lg overflow-hidden" style={{ background: "#25365C", color: "#F3F5F7" }}>
            <button
              onClick={() => setViewWeekStart((current) => { const previous = new Date(current); previous.setDate(current.getDate() - 7); return previous; })}
              className="p-2 hover:opacity-70"
              title="Previous week"
            ><ChevronLeft size={16} /></button>
            <button
              onClick={() => setViewWeekStart(startOfWeek(new Date()))}
              className="px-2 text-xs font-medium hover:opacity-70 whitespace-nowrap"
            >{viewWeekKey.slice(5)} → {viewWeekEnd.slice(5)}</button>
            <button
              onClick={() => setViewWeekStart((current) => { const next = new Date(current); next.setDate(current.getDate() + 7); return next; })}
              className="p-2 hover:opacity-70"
              title="Next week"
            ><ChevronRight size={16} /></button>
          </div>
          <button
            onClick={() => !viewedWeekClosing && setCloseWeekModal({ confirmed: false })}
            disabled={Boolean(viewedWeekClosing)}
            className="flex items-center gap-1.5 px-3 py-2 rounded-lg text-sm font-medium transition"
            style={{ background: viewedWeekClosing ? "#495A78" : "#F59F00", color: "#FFFFFF", cursor: viewedWeekClosing ? "not-allowed" : "pointer" }}
          >
            <Check size={16} />
            <span className="hidden sm:inline">{viewedWeekClosing ? t.weekClosed : t.closeWeek}</span>
          </button>
          <button
            onClick={() => setPayrollOpen(true)}
            className="flex items-center gap-1.5 px-3 py-2 rounded-lg text-sm font-medium hover:opacity-80 transition"
            style={{ background: "#12B886", color: "#FFFFFF" }}
            title={t.payrollTitle}
          >
            <Wallet size={16} />
            <span className="hidden sm:inline">{t.payroll}</span>
          </button>
          <button
            onClick={() => {
              setSyncConfigText("");
              setSyncCodeInput(syncCfg?.syncCode || "");
              setSyncModalOpen(true);
            }}
            className="flex items-center gap-1.5 px-3 py-2 rounded-lg text-sm font-medium hover:opacity-80 transition"
            style={{
              background: "#25365C",
              color:
                syncStatus === "synced" ? "#63E6BE" : syncStatus === "error" ? "#FF8787" : "#F3F5F7",
            }}
            title={t[
              syncStatus === "synced"
                ? "syncSynced"
                : syncStatus === "connecting"
                ? "syncConnecting"
                : syncStatus === "error"
                ? "syncError"
                : "syncOffline"
            ]}
          >
            <Cloud size={16} />
            <span className="hidden sm:inline">
              {t[
                syncStatus === "synced"
                  ? "syncSynced"
                  : syncStatus === "connecting"
                  ? "syncConnecting"
                  : syncStatus === "error"
                  ? "syncError"
                  : "syncOffline"
              ]}
            </span>
          </button>
          <button
            onClick={() => setLang((l) => (l === "vi" ? "en" : "vi"))}
            className="px-3 py-2 rounded-lg text-sm font-medium hover:opacity-80 transition"
            style={{ background: "#25365C", color: "#F3F5F7" }}
            title="Switch language"
          >
            {t.langLabel}
          </button>
          <button
            onClick={() => setRowHeight((h) => clamp(h - 12, 32, 100))}
            className="p-2 rounded-lg hover:opacity-80 transition"
            style={{ background: "#25365C", color: "#F3F5F7" }}
            title={t.shrink}
          >
            <ZoomOut size={16} />
          </button>
          <button
            onClick={() => setRowHeight((h) => clamp(h + 12, 32, 100))}
            className="p-2 rounded-lg hover:opacity-80 transition"
            style={{ background: "#25365C", color: "#F3F5F7" }}
            title={t.zoomIn}
          >
            <ZoomIn size={16} />
          </button>
        </div>
      </div>

      <div className="flex flex-1 flex-col md:flex-row min-h-0">
        <div className="md:w-64 w-full shrink-0 border-b md:border-b-0 md:border-r" style={{ borderColor: "#DDE3E8", background: "#FFFFFF" }}>
          <div className="p-4">
            <div className="flex items-center gap-2 mb-3" style={{ color: "#6B7A99" }}>
              <Users size={15} />
              <span className="text-xs font-semibold uppercase tracking-wide">{t.students}</span>
            </div>

            <button
              onClick={() => setFilterId(null)}
              className="w-full text-left px-3 py-2 rounded-lg text-sm mb-1 transition"
              style={{
                background: filterId === null ? "#1B2A4A" : "transparent",
                color: filterId === null ? "#FFFFFF" : "#16213E",
              }}
            >
              {t.allStudents}
            </button>

            <div className="flex flex-col gap-1 mt-1">
              {students.map((s) => {
                const c = colorFor(s);
                const count = sessions.filter((x) => x.studentId === s.id).length;
                const active = filterId === s.id;
                return (
                  <div
                    key={s.id}
                    className="flex items-center gap-2 px-3 py-2 rounded-lg text-sm cursor-pointer group"
                    style={{ background: active ? c.soft : "transparent" }}
                    onClick={() => setFilterId(active ? null : s.id)}
                  >
                    <span className="w-2.5 h-2.5 rounded-full shrink-0" style={{ background: c.bg }} />
                    <span className="flex-1 truncate">{s.name}</span>
                    <button
                      className="flex items-center gap-1 text-[10px] px-1.5 py-0.5 rounded hover:opacity-80"
                      style={{ background: "#F3F5F7", color: "#6B7A99" }}
                      title={t.editStudent}
                      onClick={(e) => {
                        e.stopPropagation();
                        setStudentModal({ ...s, hourlyRate: s.hourlyRate || 0 });
                      }}
                    >
                      {Number(s.hourlyRate || 0).toLocaleString(lang === "vi" ? "vi-VN" : "en-US")}
                      <Pencil size={10} />
                    </button>
                    <span className="text-xs" style={{ color: "#6B7A99" }}>
                      {count}
                    </span>
                    {confirmDeleteStudent === s.id ? (
                      <button
                        className="text-xs px-1.5 py-0.5 rounded"
                        style={{ background: "#FA5252", color: "#fff" }}
                        onClick={(e) => {
                          e.stopPropagation();
                          removeStudent(s.id);
                        }}
                      >
                        {t.deleteConfirm}
                      </button>
                    ) : (
                      <button
                        className="opacity-0 group-hover:opacity-100 transition"
                        style={{ color: "#6B7A99" }}
                        onClick={(e) => {
                          e.stopPropagation();
                          setConfirmDeleteStudent(s.id);
                          setTimeout(() => setConfirmDeleteStudent(null), 2500);
                        }}
                        title={t.deleteStudentTitle}
                      >
                        <Trash2 size={14} />
                      </button>
                    )}
                  </div>
                );
              })}
            </div>

            {addingStudent ? (
              <div className="mt-3 flex flex-col gap-2">
                <input
                  autoFocus
                  value={newStudentName}
                  onChange={(e) => setNewStudentName(e.target.value)}
                  onKeyDown={(e) => {
                    if (e.key === "Enter") addStudent();
                    if (e.key === "Escape") setAddingStudent(false);
                  }}
                  placeholder={t.studentNamePlaceholder}
                  className="w-full px-3 py-2 rounded-lg text-sm border outline-none"
                  style={{ borderColor: "#DDE3E8" }}
                />
                <div>
                  <label className="text-xs font-medium" style={{ color: "#6B7A99" }}>{t.hourlyRate}</label>
                  <input
                    type="number"
                    min="0"
                    step="10000"
                    value={newStudentRate}
                    onChange={(e) => setNewStudentRate(e.target.value)}
                    className="w-full mt-1 px-3 py-2 rounded-lg text-sm border outline-none"
                    style={{ borderColor: "#DDE3E8" }}
                  />
                </div>
                <div className="flex gap-2">
                  <button
                    onClick={addStudent}
                    className="flex-1 px-3 py-1.5 rounded-lg text-sm text-white"
                    style={{ background: STUDENT_COLORS[nextColor].bg }}
                  >
                    {t.add}
                  </button>
                  <button
                    onClick={() => setAddingStudent(false)}
                    className="px-3 py-1.5 rounded-lg text-sm"
                    style={{ background: "#F3F5F7" }}
                  >
                    {t.cancel}
                  </button>
                </div>
              </div>
            ) : (
              <button
                onClick={() => setAddingStudent(true)}
                className="mt-3 w-full flex items-center justify-center gap-1.5 px-3 py-2 rounded-lg text-sm border border-dashed transition hover:opacity-80"
                style={{ borderColor: "#B7C2D0", color: "#6B7A99" }}
              >
                <Plus size={14} /> {t.addStudent}
              </button>
            )}
          </div>
        </div>

        <div className="flex-1 flex flex-col min-w-0">
          <div className="flex border-b" style={{ borderColor: "#DDE3E8", background: "#FFFFFF" }}>
            <div className="w-14 shrink-0" />
            <div className="flex-1 grid grid-cols-7">
              {t.dayLabels.map((d, i) => (
                <div
                  key={d}
                  className="py-2.5 text-center text-sm font-medium border-l"
                  style={{
                    borderColor: "#DDE3E8",
                    color: isCurrentWeek && i === todayIndex ? "#1B2A4A" : "#6B7A99",
                    background: isCurrentWeek && i === todayIndex ? "#EAF0FF" : "transparent",
                  }}
                >
                  <span className="hidden sm:inline">{d}</span>
                  <span className="sm:hidden">{t.dayShort[i]}</span>
                  <div className="text-[10px] font-mono mt-0.5 opacity-70">{String(viewWeekDates[i].getDate()).padStart(2, "0")}/{String(viewWeekDates[i].getMonth() + 1).padStart(2, "0")}</div>
                </div>
              ))}
            </div>
          </div>

          <div ref={scrollRef} className="flex-1 overflow-y-auto" style={{ background: "#FFFFFF" }}>
            <div className="flex" style={{ height: totalHeight }}>
              <div className="w-14 shrink-0 relative" style={{ color: "#8896AC" }}>
                {HOURS.map((h) => (
                  <div
                    key={h}
                    className="absolute right-2 text-[11px] font-mono"
                    style={{ top: (h - START_HOUR) * rowHeight - 6 }}
                  >
                    {String(h).padStart(2, "0")}:00
                  </div>
                ))}
              </div>

              <div ref={gridRef} className="flex-1 grid grid-cols-7 relative">
                {Array.from({ length: 7 }, (_, dayIndex) => (
                  <div
                    key={dayIndex}
                    className="relative border-l cursor-crosshair"
                    style={{
                      borderColor: "#DDE3E8",
                      background: `${isCurrentWeek && dayIndex === todayIndex ? "#FBFCFE " : "#FFFFFF "}repeating-linear-gradient(
                        to bottom,
                        transparent 0,
                        transparent ${rowHeight - 1}px,
                        #EBEEF1 ${rowHeight - 1}px,
                        #EBEEF1 ${rowHeight}px
                      )`,
                    }}
                    onClick={(e) => onColumnClick(e, dayIndex)}
                  >
                    {isCurrentWeek && dayIndex === todayIndex && nowMinutes >= START_MIN && nowMinutes <= END_MIN && (
                      <div
                        className="absolute left-0 right-0 flex items-center pointer-events-none z-10"
                        style={{ top: ((nowMinutes - START_MIN) / 60) * rowHeight }}
                      >
                        <span className="w-1.5 h-1.5 rounded-full -ml-0.5" style={{ background: "#FF6B4A" }} />
                        <span className="flex-1 h-px" style={{ background: "#FF6B4A" }} />
                      </div>
                    )}

                    {visibleSessions
                      .filter((s) => s.day === dayIndex)
                      .map((s) => {
                        const student = studentById(s.studentId);
                        const c = colorFor(student);
                        const top = ((s.start - START_MIN) / 60) * rowHeight;
                        const height = Math.max((s.duration / 60) * rowHeight, 18);
                        const compact = height < 34;
                        const occurrenceKey = currentWeekOccurrenceKey(s);
                        const taught = (lessonRecords[occurrenceKey]?.status || attendance[occurrenceKey]) === "completed";
                        return (
                          <div
                            key={s.id}
                            onMouseDown={(e) => onSessionMouseDown(e, s)}
                            onClick={(e) => e.stopPropagation()}
                            onDoubleClick={(e) => {
                              e.stopPropagation();

              <div className="flex flex-col gap-3">
                <div>
                  <label className="text-xs font-medium" style={{ color: "#6B7A99" }}>
                    {t.syncedAs}
                  </label>
                  <div
                    className="mt-1.5 px-3 py-2 rounded-lg text-sm font-mono"
                    style={{ background: "#F3F5F7" }}
                  >
                    {syncCfg.syncCode}
                  </div>
                </div>
                <button
                  onClick={copySyncLink}
                  className="px-3 py-2 rounded-lg text-sm text-white font-medium"
                  style={{ background: "#1B2A4A" }}
                >
                  {t.copyLink}
                </button>
                {copyFeedback && (
                  <div className="text-xs break-all" style={{ color: "#6B7A99" }}>
                    {copyFeedback}
                  </div>
                )}
                <p className="text-xs" style={{ color: "#6B7A99" }}>
                  {t.syncHelp}
                </p>
                <button
                  onClick={disconnectSync}
                  className="px-3 py-2 rounded-lg text-sm"
                  style={{ background: "#FFECEC", color: "#E03131" }}
                >
                  {t.disconnect}
                </button>
              </div>
            ) : (
              <div className="flex flex-col gap-3">
                <div>
                  <label className="text-xs font-medium" style={{ color: "#6B7A99" }}>
                    {t.syncConfigLabel}
                  </label>
                  <textarea
                    value={syncConfigText}
                    onChange={(e) => setSyncConfigText(e.target.value)}
                    placeholder={t.syncConfigPlaceholder}
                    rows={6}
                    className="w-full mt-1.5 px-3 py-2 rounded-lg text-xs font-mono border outline-none"
                    style={{ borderColor: "#DDE3E8" }}
                  />
                </div>
                <div>
                  <label className="text-xs font-medium" style={{ color: "#6B7A99" }}>
                    {t.syncCodeLabel}
                  </label>
                  <input
                    value={syncCodeInput}
                    onChange={(e) => setSyncCodeInput(e.target.value)}
                    placeholder={t.syncCodePlaceholder}
                    className="w-full mt-1.5 px-3 py-2 rounded-lg text-sm border outline-none"
                    style={{ borderColor: "#DDE3E8" }}
                  />
                </div>
                <button
                  onClick={connectSync}
                  className="px-3 py-2 rounded-lg text-sm text-white font-medium"
                  style={{ background: "#1B2A4A" }}
                >
                  {t.connect}
                </button>
              </div>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
