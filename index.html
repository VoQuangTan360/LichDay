function openLocalDatabase() {
  return new Promise((resolve, reject) => {
    if (!window.indexedDB) return reject(new Error("IndexedDB unavailable"));
    const request = indexedDB.open(LOCAL_DB_NAME, LOCAL_DB_VERSION);
    request.onupgradeneeded = () => {
      const db = request.result;
      if (!db.objectStoreNames.contains("state")) db.createObjectStore("state", { keyPath: "id" });
      if (!db.objectStoreNames.contains("snapshots")) db.createObjectStore("snapshots", { keyPath: "id" });
      if (!db.objectStoreNames.contains("meta")) db.createObjectStore("meta", { keyPath: "id" });
    };
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
}

async function idbRequest(storeName, mode, action) {
  const db = await openLocalDatabase();
  return new Promise((resolve, reject) => {
    const transaction = db.transaction(storeName, mode);
    const store = transaction.objectStore(storeName);
    const request = action(store);
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
    transaction.oncomplete = () => db.close();
  });
}

const idbGet = (store, id) => idbRequest(store, "readonly", (objectStore) => objectStore.get(id));
const idbPut = (store, value) => idbRequest(store, "readwrite", (objectStore) => objectStore.put(value));
const idbGetAll = (store) => idbRequest(store, "readonly", (objectStore) => objectStore.getAll());
const idbDelete = (store, id) => idbRequest(store, "readwrite", (objectStore) => objectStore.delete(id));

async function persistLocalPayload(payload, forceSnapshot = false) {
  const savedAt = Date.now();
  const current = await idbGet("state", LOCAL_STATE_KEY);
  const revision = Number(current?.revision || 0) + 1;
  await idbPut("state", { id: LOCAL_STATE_KEY, payload, savedAt, revision, schemaVersion: 4 });
  const meta = await idbGet("meta", "snapshots");
  if (forceSnapshot || !meta?.lastSnapshotAt || savedAt - meta.lastSnapshotAt >= LOCAL_SNAPSHOT_INTERVAL) {
    await idbPut("snapshots", { id: String(savedAt), payload, savedAt, revision, schemaVersion: 4 });
    await idbPut("meta", { id: "snapshots", lastSnapshotAt: savedAt });
    const snapshots = (await idbGetAll("snapshots")).sort((a, b) => b.savedAt - a.savedAt);
    await Promise.all(snapshots.slice(10).map((snapshot) => idbDelete("snapshots", snapshot.id)));
  }
  return { savedAt, revision };
}

function enqueueLocalPayload(payload, forceSnapshot = false) {
  const stablePayload = typeof structuredClone === "function"
    ? structuredClone(payload)
    : JSON.parse(JSON.stringify(payload));
  LOCAL_SAVE_QUEUE = LOCAL_SAVE_QUEUE
    .catch(() => {})
    .then(() => persistLocalPayload(stablePayload, forceSnapshot));
  return LOCAL_SAVE_QUEUE;
}

function pricingForStudent(session, student) {
  const legacyRate = Number(session.studentRates?.[student?.id] ?? student?.hourlyRate) || 0;
  const pricing = session.studentPricing?.[student?.id] || { mode: "hourly", amount: legacyRate };
  return { mode: pricing.mode === "fixed" ? "fixed" : "hourly", amount: Math.max(0, Number(pricing.amount) || 0) };
}

function calculatedLessonFee(session, student) {
  const pricing = pricingForStudent(session, student);
  return pricing.mode === "fixed" ? pricing.amount : (session.duration / 60) * pricing.amount;
}

function lessonRecordFromTemplate(key, session, student, status) {
  const lessonDate = key.split("|")[0];
  const pricing = pricingForStudent(session, student);
  const unitPrice = pricing.amount;
  const calculatedAmount = calculatedLessonFee(session, student);
  return {
    key,
    date: lessonDate,
    sessionId: session.id,
    studentId: student?.id || session.studentId,
    studentName: student?.name || "?",
    start: session.start,
    duration: session.duration,
    note: session.note || "",
    details: session.details || "",
    pricingMode: pricing.mode === "fixed" ? "fixed" : "hourly",
    unitPrice,
    hourlyRate: unitPrice,
    amount: status === "completed" ? calculatedAmount : 0,
    status,
  };
}

function normalizeSession(session, students) {
  const studentIds = Array.isArray(session.studentIds) && session.studentIds.length
    ? session.studentIds
    : session.studentId
    ? [session.studentId]
    : [];
  const studentRates = { ...(session.studentRates || {}) };
  const studentPricing = { ...(session.studentPricing || {}) };
  studentIds.forEach((studentId) => {
    if (studentRates[studentId] == null) {
      studentRates[studentId] = Number((students || []).find((student) => student.id === studentId)?.hourlyRate) || 0;
    }
    if (!studentPricing[studentId]) studentPricing[studentId] = { mode: "hourly", amount: Number(studentRates[studentId]) || 0 };
  });
  return { effectiveFrom: "1970-01-01", details: "", ...session, studentId: studentIds[0] || null, studentIds, studentRates, studentPricing };
}

function normalizeLessonRecords(records) {
  const normalized = {};
  Object.values(records || {}).forEach((record) => {
    if (!record || !record.studentId || !record.key) return;
    const parts = record.key.split("|");
    const key = parts.length >= 3 ? record.key : `${record.key}|${record.studentId}`;
    normalized[key] = {
      pricingMode: "hourly",
      unitPrice: Number(record.hourlyRate) || 0,
      details: "",
      ...record,
      key,
    };
  });
  return normalized;
}

function migrateLegacyAttendance(attendance, sessions, students) {
  const records = {};
  Object.entries(attendance || {}).forEach(([key, status]) => {
    if (status === "planned") return;
    const sessionId = key.split("|")[1];
    const session = (sessions || []).find((item) => item.id === sessionId);
    if (!session) return;
    const student = (students || []).find((item) => item.id === session.studentId);
    const studentKey = `${key}|${session.studentId}`;
    records[studentKey] = lessonRecordFromTemplate(studentKey, normalizeSession(session, students), student, status);
  });
  return records;
}

function makeSyncError(error, operation, config = {}) {
  const redact = (value) => {
    let text = String(value || "");
    Object.values(config || {}).filter((secret) => typeof secret === "string" && secret.length >= 3)
      .sort((a, b) => b.length - a.length).forEach((secret) => { text = text.split(secret).join("[hidden]"); });
    return text.replace(/https?:\/\/[^\s]+/gi, "[URL hidden]")
      .replace(/AIza[\w-]+/g, "[key hidden]")
      .replace(/(Bearer\s+)[^\s]+/gi, "$1[hidden]");
  };
  return { id: uid(), at: Date.now(), operation, code: redact(error?.code || (error?.name !== "Error" && error?.name) || "unknown").slice(0, 120), message: redact(error?.message || error || "Unknown error").slice(0, 1500), count: 1 };

function fingerprintText(text) {
  let hash = 2166136261;
  for (let index = 0; index < text.length; index += 1) {
    hash ^= text.charCodeAt(index);

  return `${(hash >>> 0).toString(16).padStart(8, "0")}:${text.length}`;
}

        setBackupPreview({ source: "file", payload, savedAt: parsed.exportedAt || file.lastModified, summary: backupSummary(payload) });
        setBackupFeedback("");
      } catch (error) {
        setBackupFeedback(t.backupInvalid);
      }
    };
    reader.readAsText(file);

  async function readFirebaseBackupVersion(ref, revision, fallback) {
    if (!revision) return fallback || null;
    const versionId = fallback?.versionId || String(revision);
    const versionSnapshot = await ref.collection("versions").doc(versionId).get();
    if (!versionSnapshot.exists) return fallback || null;
    const version = versionSnapshot.data();
    if (version.payload) return { ...version, versionId };
    const partCount = Number(version.partCount || 0);
    if (!partCount) return version;
    const partSnapshots = await Promise.all(Array.from({ length: partCount }, (_, index) =>
      versionSnapshot.ref.collection("parts").doc(String(index).padStart(5, "0")).get()
    ));
    const payloadJson = partSnapshots.map((part) => part.data()?.data || "").join("");
    return { ...version, versionId, payload: JSON.parse(payloadJson) };
  }

  function rememberCloudVersion(revision, fingerprint, savedAt = Date.now()) {
    knownCloudRevisionRef.current = Number(revision || 0);
    lastCloudFingerprintRef.current = fingerprint || "";
    setLastCloudSavedAt(savedAt);
    if (syncCfg?.syncCode) saveCloudMeta(syncCfg.syncCode, { revision: Number(revision || 0), fingerprint: fingerprint || "", savedAt });
  }

  async function deleteFirebaseVersion(versionRef) {
    const partSnapshots = await versionRef.collection("parts").get();
    for (let offset = 0; offset < partSnapshots.docs.length; offset += 400) {
      const batch = dbRef.current.batch();
      partSnapshots.docs.slice(offset, offset + 400).forEach((part) => batch.delete(part.ref));
      await batch.commit();
    }
    await versionRef.delete();
  }

  async function trimFirebaseVersions(ref) {
    const snapshot = await ref.collection("versions").orderBy("revision", "desc").get();
    const completed = snapshot.docs.filter((version) => version.data().status !== "staging");
    const abandoned = snapshot.docs.filter((version) => version.data().status === "staging");
    for (const oldVersion of [...completed.slice(10), ...abandoned]) await deleteFirebaseVersion(oldVersion.ref);
  }

  async function checkFirebaseBackup() {
    if (!dbRef.current || !syncCfg?.syncCode) return;
    setSyncStatus("connecting");
    try {
      const snapshot = await dbRef.current.collection("scheduleBackups").doc(syncCfg.syncCode).get();
      if (!snapshot.exists) {
        rememberCloudVersion(0, "", Date.now());
        autoBackupBlockedRef.current = false;
        setCloudBackup(null);
        setCloudBackups([]);
        setBackupFeedback(t.noCloudBackup);
        setAutoBackupStatus("pending");
        setAutoBackupRetryToken((value) => value + 1);
      } else {
        const data = snapshot.data();
        const revision = Number(data.revision || 0);
        const versionsSnapshot = await snapshot.ref
          .collection("versions")
          .orderBy("revision", "desc")
          .limit(10)
          .get();
        let versions = versionsSnapshot.docs.filter((document) => document.data().status !== "staging").map((document) => {
          const version = document.data();
          return {
            ...version,
            revision: Number(version.revision || document.id),
            versionId: version.versionId || document.id,
            summary: version.summary || {},
          };
        });
        if (!versions.length) {
          const versionData = await readFirebaseBackupVersion(snapshot.ref, revision, data);
          versions = [{
            ...data,
            ...versionData,
            revision,
            summary: data.summary || backupSummary(versionData?.payload),
          }];
        }
        setCloudBackups(versions);
        setCloudBackup(versions[0] || null);
        const localFingerprint = payloadFingerprint(currentPayload());
        const isKnownVersion = revision === knownCloudRevisionRef.current;
        const isSameData = Boolean(data.fingerprint) && data.fingerprint === localFingerprint;
        if (isKnownVersion || isSameData) {
          rememberCloudVersion(revision, data.fingerprint || (isSameData ? localFingerprint : lastCloudFingerprintRef.current), data.updatedAt || Date.now());
          autoBackupBlockedRef.current = false;
          setAutoBackupStatus(isSameData ? "saved" : "pending");
          setBackupFeedback("");
          if (!isSameData) setAutoBackupRetryToken((value) => value + 1);
        } else {
          autoBackupBlockedRef.current = true;
          setAutoBackupStatus("conflict");
          setBackupFeedback(t.cloudConflict);
          reportSyncError("check", { code: "cloud-conflict", message: "Cloud revision differs from the revision known by this device." });
          setSyncStatus("conflict");
          return;
        }
      }
      setSyncStatus("synced");
    } catch (error) {
      console.warn("Could not check Firebase backup:", error);
      reportSyncError("check", error);
      setSyncStatus("error");
    }
  }

  async function uploadFirebaseBackup(options = {}) {
    const automatic = options?.automatic === true;
    if (!dbRef.current || !syncCfg?.syncCode || cloudUploadInFlightRef.current || autoBackupBlockedRef.current) return;
    cloudUploadInFlightRef.current = true;
    setSyncStatus("connecting");
    if (automatic) setAutoBackupStatus("saving");
    let stagedVersionRef = null;
    try {
      const ref = dbRef.current.collection("scheduleBackups").doc(syncCfg.syncCode);
      const payload = currentPayload();
      const payloadJson = JSON.stringify(payload);
      const fingerprint = fingerprintText(payloadJson);
      const snapshot = await ref.get();
      const remoteData = snapshot.exists ? snapshot.data() : null;
      const remoteRevision = Number(remoteData?.revision || 0);

      if (remoteData?.fingerprint === fingerprint) {
        rememberCloudVersion(remoteRevision, fingerprint, remoteData.updatedAt || Date.now());
        autoBackupBlockedRef.current = false;
        setAutoBackupStatus("saved");
        setBackupFeedback(automatic ? "" : t.backupSuccess);
        setSyncStatus("synced");
        return;
      }
      if (remoteRevision !== knownCloudRevisionRef.current) {
        const conflict = new Error("cloud-conflict");
        conflict.code = "cloud-conflict";
        throw conflict;
      }

      const nextRevision = remoteRevision + 1;
      const versionId = `${nextRevision}-${deviceIdRef.current}-${uid()}`;
      const updatedAt = Date.now();
      const parts = payloadJson.match(/[\s\S]{1,200000}/g) || [""];
      stagedVersionRef = ref.collection("versions").doc(versionId);
      await stagedVersionRef.set({ status: "staging", revision: -1, versionId, updatedAt, deviceId: deviceIdRef.current });
      for (let offset = 0; offset < parts.length; offset += 400) {
        const partsBatch = dbRef.current.batch();
        parts.slice(offset, offset + 400).forEach((data, index) => {
          const partIndex = offset + index;
          partsBatch.set(stagedVersionRef.collection("parts").doc(String(partIndex).padStart(5, "0")), { data });
        });
        await partsBatch.commit();
      }

      const manifest = {
        schemaVersion: 4,
        revision: nextRevision,
        versionId,
        updatedAt,
        deviceId: deviceIdRef.current,
        fingerprint,
        summary: backupSummary(payload),
        partCount: parts.length,
        status: "complete",
      };
      await dbRef.current.runTransaction(async (transaction) => {
        const freshSnapshot = await transaction.get(ref);
        const freshRevision = freshSnapshot.exists ? Number(freshSnapshot.data().revision || 0) : 0;
        if (freshRevision !== remoteRevision) {
          const conflict = new Error("cloud-conflict");
          conflict.code = "cloud-conflict";
          throw conflict;
        }
        transaction.set(stagedVersionRef, manifest);
        transaction.set(ref, manifest);
      });

      const next = { ...manifest, payload };
      rememberCloudVersion(nextRevision, fingerprint, updatedAt);
      autoBackupBlockedRef.current = false;
      setCloudBackup(next);
      setCloudBackups((previous) => [next, ...previous.filter((item) => item.versionId !== versionId)].slice(0, 10));
      setBackupFeedback(automatic ? "" : t.backupSuccess);
      setAutoBackupStatus("saved");
      setSyncStatus("synced");
      if (!automatic) {
        recordActivity("backup.firebase.upload", lang === "vi" ? `Đã sao lưu Firebase revision ${nextRevision}` : `Backed up Firebase revision ${nextRevision}`, { revision: nextRevision });
        window.setTimeout(() => setBackupFeedback((current) => current === t.backupSuccess ? "" : current), 3500);
      }
      trimFirebaseVersions(ref).catch((error) => { console.warn("Could not trim old Firebase backups:", error); reportSyncError("cleanup", error); });
      setAutoBackupRetryToken((value) => value + 1);
    } catch (error) {
      reportSyncError(automatic ? "automatic" : "upload", error);
      if (stagedVersionRef) {
        deleteFirebaseVersion(stagedVersionRef).catch((cleanupError) => { console.warn("Could not clean staged Firebase backup:", cleanupError); reportSyncError("cleanup", cleanupError); });
      }
      if (error?.code === "cloud-conflict" || error?.message === "cloud-conflict") {
        autoBackupBlockedRef.current = true;
        setAutoBackupStatus("conflict");
        setBackupFeedback(t.cloudConflict);
        setSyncStatus("conflict");
      } else {
        console.warn("Could not upload Firebase backup:", error);
        setAutoBackupStatus(navigator.onLine === false ? "offline" : "pending");
        setSyncStatus("error");
        if (automatic) window.setTimeout(() => setAutoBackupRetryToken((value) => value + 1), 30000);
      }
    } finally {
      cloudUploadInFlightRef.current = false;
    }
  }

  async function restoreFirebaseBackup(selectedBackup = cloudBackup) {
    if (!selectedBackup || !dbRef.current || !syncCfg?.syncCode) return;
    if (!window.confirm(t.restoreConfirm)) return;
    setSyncStatus("connecting");
    try {
      const ref = dbRef.current.collection("scheduleBackups").doc(syncCfg.syncCode);
      const rootSnapshot = await ref.get();
      const rootData = rootSnapshot.exists ? rootSnapshot.data() : {};
      const rootRevision = Number(rootData.revision || 0);
      const loadedBackup = selectedBackup.payload
        ? selectedBackup
        : await readFirebaseBackupVersion(ref, selectedBackup.revision, selectedBackup);
      if (!loadedBackup?.payload) throw new Error("Firebase backup payload is missing");
      await enqueueLocalPayload(currentPayload(), true);
      applyPayload(loadedBackup.payload);
      rememberCloudVersion(rootRevision, rootData.fingerprint || "", rootData.updatedAt || Date.now());
      autoBackupBlockedRef.current = false;
      setAutoBackupStatus("pending");
      recordActivity("backup.firebase.restore", lang === "vi" ? `Đã khôi phục Firebase revision ${selectedBackup.revision}` : `Restored Firebase revision ${selectedBackup.revision}`, { revision: selectedBackup.revision });
      setBackupFeedback(t.restoreSuccess);
      setSyncStatus("synced");
      setAutoBackupRetryToken((value) => value + 1);
    } catch (error) {
      console.warn("Could not restore Firebase backup:", error);
      reportSyncError("restore", error);
      setSyncStatus("error");
    }
  }

  async function syncLatestFirebaseBackup() {
    if (syncStatus === "connecting") return;
    if (!syncCfg || !dbRef.current) {
      setSyncConfigText("");
      setSyncCodeInput(syncCfg?.syncCode || "");
      setSyncInputError("");
      openStorageModal();
      return;
    }
    if (!window.confirm(t.syncLatestConfirm)) return;
    setSyncStatus("connecting");
    try {
      const ref = dbRef.current.collection("scheduleBackups").doc(syncCfg.syncCode);
      const snapshot = await ref.get();
      if (!snapshot.exists) {
        rememberCloudVersion(0, "", Date.now());
        autoBackupBlockedRef.current = false;
        setAutoBackupStatus("pending");
        setAutoBackupRetryToken((value) => value + 1);
        setBackupFeedback(t.noCloudBackup);
        setSyncStatus("synced");
        return;
      }
      const data = snapshot.data();
      const revision = Number(data.revision || 0);
      const latestBackup = await readFirebaseBackupVersion(ref, revision, data);
      if (!latestBackup?.payload) throw new Error("Firebase backup payload is missing");
      await enqueueLocalPayload(currentPayload(), true);
      applyPayload(latestBackup.payload);
      const fingerprint = data.fingerprint || latestBackup.fingerprint || payloadFingerprint(latestBackup.payload);
      rememberCloudVersion(revision, fingerprint, data.updatedAt || latestBackup.updatedAt || Date.now());
      autoBackupBlockedRef.current = false;
      setAutoBackupStatus("saved");
      const restoredBackup = {
        ...data,
        ...latestBackup,
        revision,
        summary: data.summary || backupSummary(latestBackup.payload),
      };
      setCloudBackup(restoredBackup);
      setCloudBackups((previous) => [restoredBackup, ...previous.filter((item) => item.revision !== revision)].slice(0, 10));
      recordActivity("backup.firebase.sync", lang === "vi" ? `Đã lấy Firebase revision ${revision} về máy` : `Synced Firebase revision ${revision} to this device`, { revision });
      setBackupFeedback(t.syncLatestSuccess);
      window.setTimeout(() => setBackupFeedback((current) => current === t.syncLatestSuccess ? "" : current), 3500);
      setSyncStatus("synced");
      setAutoBackupRetryToken((value) => value + 1);
    } catch (error) {
      console.warn("Could not sync latest Firebase backup:", error);
      reportSyncError("download", error);
      setSyncStatus("error");
    }
  }

    recordActivity("session.delete", lang === "vi" ? `Đã xóa lớp trong tuần ${viewWeekKey}` : `Deleted class in week ${viewWeekKey}`, { week: viewWeekKey, sessionId: modal.id });
    if (modal.occurrenceDate) saveOccurrenceNote(modal.occurrenceDate, modal.id, "");
    updateViewedWeekSessions((prev) => prev.filter((s) => s.id !== modal.id));
    setModal(null);
  }

  const onSessionMouseDown = useCallback(
    (e, session) => {
      e.stopPropagation();
      if (viewedWeekClosingRef.current) return;
      if (e.button !== 0) return;
      const rect = gridRef.current.getBoundingClientRect();
      dragState.current = {
        id: session.id,
        moved: false,
        startX: e.clientX,
        startY: e.clientY,
        origDay: session.day,
        origStart: session.start,
        rect,
        colWidth: rect.width / 7,
      };
      window.addEventListener("mousemove", onDragMove);
      window.addEventListener("mouseup", onDragUp);
    },
    [rowHeight]
  );

  const onDragMove = useCallback(
    (e) => {
      const ds = dragState.current;
      if (!ds) return;
      const dx = e.clientX - ds.startX;
      const dy = e.clientY - ds.startY;
      if (!ds.moved && Math.abs(dx) < 4 && Math.abs(dy) < 4) return;
      ds.moved = true;
      suppressSessionEditRef.current = true;

      const deltaMinutes = (dy / rowHeight) * 60;
      let newStart = Math.round((ds.origStart + deltaMinutes) / SNAP) * SNAP;
      newStart = clamp(newStart, START_MIN, END_MIN - MIN_DURATION);

      const dayIndex = clamp(Math.floor((e.clientX - ds.rect.left) / ds.colWidth), 0, 6);
      ds.newDay = dayIndex;
      ds.newStart = newStart;

      updateViewedWeekSessionsRef.current((prev) =>
        prev.map((s) =>
          s.id === ds.id
            ? (recordsRefreshSessionIdsRef.current.add(s.id), { ...s, day: dayIndex, start: clamp(newStart, START_MIN, END_MIN - s.duration) })
            : s
        )
      );
    },
    [rowHeight]
  );

  const onDragUp = useCallback(() => {
    const finishedDrag = dragState.current;
    const wasMoved = Boolean(finishedDrag?.moved);
    window.removeEventListener("mousemove", onDragMove);
    window.removeEventListener("mouseup", onDragUp);
    dragState.current = null;
    if (wasMoved) {
      recordActivity("session.move", lang === "vi" ? `Đã di chuyển lớp trong tuần ${viewWeekKey}` : `Moved class in week ${viewWeekKey}`, { week: viewWeekKey, sessionId: finishedDrag.id, fromDay: finishedDrag.origDay, fromStart: finishedDrag.origStart, toDay: finishedDrag.newDay, toStart: finishedDrag.newStart });
      window.setTimeout(() => {
        suppressSessionEditRef.current = false;
      }, 500);
    }
  }, [onDragMove]);

  const resizeState = useRef(null);
  const onResizeMouseDown = useCallback(
    (e, session) => {
      if (viewedWeekClosingRef.current) return;
      e.stopPropagation();
      e.preventDefault();
      resizeState.current = { id: session.id, startY: e.clientY, origDuration: session.duration };
      window.addEventListener("mousemove", onResizeMove);
      window.addEventListener("mouseup", onResizeUp);
    },
    [rowHeight]
  );
  const onResizeMove = useCallback(
    (e) => {
      const rs = resizeState.current;
      if (!rs) return;
      const dy = e.clientY - rs.startY;
      const deltaMinutes = (dy / rowHeight) * 60;
      let newDuration = Math.round((rs.origDuration + deltaMinutes) / SNAP) * SNAP;
      newDuration = clamp(newDuration, MIN_DURATION, END_MIN - START_MIN);
      rs.newDuration = newDuration;
      updateViewedWeekSessionsRef.current((prev) =>
        prev.map((s) =>
          s.id === rs.id
            ? (recordsRefreshSessionIdsRef.current.add(s.id), { ...s, duration: clamp(newDuration, MIN_DURATION, END_MIN - s.start) })
            : s
        )
      );
    },
    [rowHeight]
  );
  const onResizeUp = useCallback(() => {
    const finishedResize = resizeState.current;
    window.removeEventListener("mousemove", onResizeMove);
    window.removeEventListener("mouseup", onResizeUp);
    resizeState.current = null;
    if (finishedResize?.newDuration && finishedResize.newDuration !== finishedResize.origDuration) {
      recordActivity("session.resize", lang === "vi" ? `Đã đổi thời lượng lớp trong tuần ${viewWeekKey}` : `Changed class duration in week ${viewWeekKey}`, { week: viewWeekKey, sessionId: finishedResize.id, fromDuration: finishedResize.origDuration, toDuration: finishedResize.newDuration });
    }
  }, [onResizeMove]);

  function onColumnClick(e, dayIndex) {
    if (viewedWeekClosing) return;
    if (dragState.current && dragState.current.moved) return;
    const rect = e.currentTarget.getBoundingClientRect();
    const y = e.clientY - rect.top;
    const minutes = START_MIN + (y / rowHeight) * 60;
    openAddModal(dayIndex, minutes);
  }

  const totalHeight = rowHeight * (END_HOUR - START_HOUR);
  const jsDay = now.getDay();
  const todayIndex = (jsDay + 6) % 7;
  const nowMinutes = now.getHours() * 60 + now.getMinutes();
  const mondayOfCurrentWeek = startOfWeek(now);
  const viewWeekKey = dateKey(viewWeekStart);
  const isCurrentWeek = viewWeekKey === dateKey(mondayOfCurrentWeek);
  const viewedWeekClosing = weeklyClosings[viewWeekKey];
  viewedWeekClosingRef.current = Boolean(viewedWeekClosing);
  const viewWeekDates = Array.from({ length: 7 }, (_, index) => {
    const date = new Date(viewWeekStart);
    date.setDate(viewWeekStart.getDate() + index);
    return date;
  });
  function currentWeekOccurrenceKey(session) {
    if (session._occurrenceDate) return `${session._occurrenceDate}|${session._sourceSessionId}`;
    const lessonDate = new Date(viewWeekStart);
    lessonDate.setDate(viewWeekStart.getDate() + session.day);
    return `${dateKey(lessonDate)}|${session.id}`;
  }

  const studentById = (id) => students.find((s) => s.id === id);
  const scheduleStudentById = (id) => (viewedWeekClosing?.studentsSnapshot || students).find((s) => s.id === id);
  const colorFor = (student) => STUDENT_COLORS[(student?.color ?? 0) % STUDENT_COLORS.length];

  const applicableDefaultVersionKey = Object.keys(defaultScheduleVersions)
    .filter((weekKey) => weekKey <= viewWeekKey)
    .sort()
    .pop();
  const versionedDefaultSessions = applicableDefaultVersionKey ? defaultScheduleVersions[applicableDefaultVersionKey] : sessions;
  const defaultSessionsForView = versionedDefaultSessions.filter((session) => {
    const occurrenceDate = dateKey(viewWeekDates[session.day]);
    return occurrenceDate >= (session.effectiveFrom || "1970-01-01");
  });
  const activeSessionsForView = weekOverrides[viewWeekKey] || defaultSessionsForView;
  async function setViewedWeekAsDefault() {
    if (defaultScheduleInFlightRef.current) return;
    defaultScheduleInFlightRef.current = true;
    setDefaultScheduleSaving(true);
    window.clearTimeout(defaultScheduleFeedbackTimerRef.current);
    setDefaultScheduleFeedback("");
    const before = currentPayload();
    const beforeSignature = JSON.stringify(before);
    // Copy the full week's template, regardless of the student filter.
    const sourceSessions = viewedWeekClosing?.sessionsSnapshot || activeSessionsForView;
    const nextDefault = sourceSessions.map((session) => {
      const {
        _occurrenceDate,
        _sourceSessionId,
        _members,
        ...cleanSession
      } = session;
      return normalizeSession({
        ...cleanSession,
        effectiveFrom: viewWeekKey,
        studentIds: [...(session.studentIds || [])],
        studentRates: { ...(session.studentRates || {}) },
        studentPricing: Object.fromEntries(
          Object.entries(session.studentPricing || {}).map(([studentId, pricing]) => [
            studentId,
            { ...pricing },
          ])
        ),
      }, students);
    });

    try {
      // Keep a recoverable copy before replacing customized future schedules.
      await enqueueLocalPayload(before, true);
      if (JSON.stringify(latestPayloadRef.current) !== beforeSignature) {
        setDefaultScheduleFeedback(t.defaultScheduleRetry);
        return;
      }
      // Later defaults and week overrides must no longer shadow the new template.
      // Keep the source/earlier weeks and all closed-week snapshots intact.
      const replacedWeeks = Object.keys(weekOverrides).filter((key) => key > viewWeekKey && !weeklyClosings[key]);
      const replacedDefaults = Object.keys(defaultScheduleVersions).filter((key) => key > viewWeekKey);
      setDefaultScheduleVersions((previous) => ({
        ...Object.fromEntries(Object.entries(previous).filter(([key]) => key < viewWeekKey)),
        [viewWeekKey]: nextDefault,
      }));
      setWeekOverrides((previous) => Object.fromEntries(
        Object.entries(previous).filter(([key]) => key <= viewWeekKey || weeklyClosings[key])
      ));
      recordActivity("schedule.default", lang === "vi"
        ? `Đã áp dụng lịch mặc định từ tuần ${viewWeekKey} cho các tuần sau, kể cả tuần đã chỉnh riêng`
        : `Applied the default schedule from week ${viewWeekKey} to later weeks, including customized weeks`,
        { week: viewWeekKey, replacedWeeks, replacedDefaults });
      setDefaultScheduleFeedback(t.defaultScheduleSet);
    } catch (error) {
      console.warn("Could not save schedule recovery copy:", error);
      setLocalSaveStatus("error");
      setDefaultScheduleFeedback(t.defaultScheduleError);
    } finally {
      defaultScheduleInFlightRef.current = false;
      setDefaultScheduleSaving(false);
      defaultScheduleFeedbackTimerRef.current = window.setTimeout(() => setDefaultScheduleFeedback(""), 6000);
    }
  }
  const scheduleSessions = viewedWeekClosing?.sessionsSnapshot || activeSessionsForView;
  const historicalGroupsForView = new Map();
  Object.values(lessonRecords).forEach((record) => {
    if (record.date < viewWeekKey || record.date > dateKey(viewWeekDates[6])) return;
    const groupKey = `${record.date}|${record.sessionId}`;
    if (!historicalGroupsForView.has(groupKey)) historicalGroupsForView.set(groupKey, []);
    historicalGroupsForView.get(groupKey).push(record);
  });
  const historicalSessionsForView = Array.from(historicalGroupsForView.entries()).map(([groupKey, records]) => {
    const first = records[0];
    const occurrenceDate = new Date(`${first.date}T00:00:00`);
    const templateSession = scheduleSessions.find((session) =>
      session.id === first.sessionId && dateKey(viewWeekDates[session.day]) === first.date
    );
    const recordByStudentId = Object.fromEntries(records.map((record) => [record.studentId, record]));
    const studentIds = [...new Set([
      ...(templateSession?.studentIds || []),
      ...records.map((record) => record.studentId),
    ])];
    return {
      id: `history-${groupKey}`,
      _sourceSessionId: first.sessionId,
      _occurrenceDate: first.date,
      _historical: true,
      day: Math.round((occurrenceDate - viewWeekStart) / 86400000),
      start: first.start,
      duration: first.duration,
      note: first.note,
      details: first.details || "",
      _occurrenceNote: occurrenceNotes[`${first.date}|${first.sessionId}`] || "",
      studentId: studentIds[0] || first.studentId,
      studentIds,
      studentRates: Object.fromEntries(studentIds.map((studentId) => {
        const record = recordByStudentId[studentId];
        return [studentId, Number(record?.hourlyRate ?? templateSession?.studentRates?.[studentId]) || 0];
      })),
      studentPricing: Object.fromEntries(studentIds.map((studentId) => {
        const record = recordByStudentId[studentId];
        const pricing = record
          ? { mode: record.pricingMode || "hourly", amount: Number(record.unitPrice ?? record.hourlyRate) || 0 }
          : pricingForStudent(templateSession || {}, scheduleStudentById(studentId));
        return [studentId, pricing];
      })),
      _members: studentIds.map((studentId) => {
        const record = recordByStudentId[studentId];
        return scheduleStudentById(studentId) || ({
          id: studentId,
          name: record?.studentName || "?",
          hourlyRate: Number(record?.hourlyRate) || 0,
          color: 0,
        });
      }),
    };
  });
  const historicalOccurrenceKeys = new Set(historicalSessionsForView.map((session) => `${session._occurrenceDate}|${session._sourceSessionId}`));
  const templateSessionsWithoutRecordedOccurrence = scheduleSessions.filter((session) => {
    const occurrenceDate = dateKey(viewWeekDates[session.day]);
    return !historicalOccurrenceKeys.has(`${occurrenceDate}|${session.id}`);
  }).map((session) => {
    const occurrenceDate = dateKey(viewWeekDates[session.day]);
    return { ...session, _occurrenceNote: occurrenceNotes[`${occurrenceDate}|${session.id}`] || "" };
  });
  const visibleSessions = [...templateSessionsWithoutRecordedOccurrence, ...historicalSessionsForView]
    .filter((s) => !filterId || s.studentIds.includes(filterId));
  function overlapStyleFor(session) {
    const peers = visibleSessions
      .filter((other) => other.day === session.day && other.start < session.start + session.duration && session.start < other.start + other.duration)
      .sort((a, b) => a.start - b.start || a.id.localeCompare(b.id));
    if (peers.length <= 1) return { left: 2, right: 2 };
    const index = Math.max(0, peers.findIndex((peer) => peer.id === session.id));
    return {
      left: `calc(${(index * 100) / peers.length}% + 2px)`,
      width: `calc(${100 / peers.length}% - 4px)`,
    };
  }
  const modalHasOverlap = Boolean(modal && activeSessionsForView.some((session) =>
    session.id !== modal.id &&
    session.day === modal.day &&
    session.start < modal.start + modal.duration &&
    modal.start < session.start + session.duration
  ));

  function updateLessonStatus(key, session, student, status) {
    if (weeklyClosings[weekKeyForDateString(key.slice(0, 10))]) return;
    recordActivity("attendance.update", lang === "vi" ? `Đã cập nhật điểm danh ${student?.name || "?"}: ${status}` : `Updated attendance for ${student?.name || "?"}: ${status}`, { key, sessionId: session.id, studentId: student?.id, status });
    const updatedRecord = status === "planned" ? null : lessonRecordFromTemplate(key, session, student, status);
    setAttendance((prev) => ({ ...prev, [key]: status }));
    setLessonRecords((prev) => {
      if (status === "planned") {
        const next = { ...prev };
        delete next[key];
        return next;
      }
      return { ...prev, [key]: updatedRecord };
    });
  }

  const viewWeekEnd = dateKey(viewWeekDates[6]);
  const viewWeekCompletedRecords = Object.values(lessonRecords).filter(
    (record) => record.date >= viewWeekKey && record.date <= viewWeekEnd && record.status === "completed"
  );
  const viewWeekClassRecords = Array.from(
    new Map(viewWeekCompletedRecords.map((record) => [`${record.date}|${record.sessionId}`, record])).values()
  );
  const viewWeekSummary = {
    sessions: viewWeekClassRecords.length,
    minutes: viewWeekClassRecords.reduce((sum, record) => sum + record.duration, 0),
    amount: viewWeekCompletedRecords.reduce((sum, record) => sum + record.amount, 0),
  };

  function finishCloseWeek() {
    if (closeWeekModal?.mode === "reopen") {
      recordActivity("week.reopen", lang === "vi" ? `Đã mở lại tuần ${viewWeekKey}` : `Reopened week ${viewWeekKey}`, { week: viewWeekKey });
      // Khôi phục đúng lịch đã được chốt (sessionsSnapshot) thành một weekOverride riêng cho tuần này,
      // thay vì để tuần rơi về lịch mặc định/đè hiện tại. Nếu không làm vậy, khi lịch mặc định đã
      // thay đổi kể từ lúc chốt tuần, mở lại tuần cũ sẽ hiển thị SAI lịch (không đúng buổi đã dạy thật).
      const closing = weeklyClosings[viewWeekKey];
      if (closing?.sessionsSnapshot) {
        setWeekOverrides((prev) => ({
          ...prev,
          [viewWeekKey]: closing.sessionsSnapshot.map((session) => normalizeSession({ ...session }, students)),
        }));
      }
      setWeeklyClosings((prev) => {
        const next = { ...prev };
        delete next[viewWeekKey];
        return next;
      });
      setCloseWeekModal(null);
      return;
    }
    recordActivity("week.close", lang === "vi" ? `Đã chốt tuần ${viewWeekKey}` : `Closed week ${viewWeekKey}`, { week: viewWeekKey, ...viewWeekSummary });
    setWeeklyClosings((prev) => ({
      ...prev,
      [viewWeekKey]: {
        weekStart: viewWeekKey,
        weekEnd: viewWeekEnd,
        sessions: viewWeekSummary.sessions,
        minutes: viewWeekSummary.minutes,
        amount: viewWeekSummary.amount,
        sessionsSnapshot: activeSessionsForView.map((session) => ({
          ...session,
          studentIds: [...session.studentIds],
          studentRates: { ...session.studentRates },
          studentPricing: Object.fromEntries(Object.entries(session.studentPricing || {}).map(([id, pricing]) => [id, { ...pricing }])),
        })),
        studentsSnapshot: students.map((student) => ({ ...student })),
        closedAt: Date.now(),
      },
    }));
    setCloseWeekModal(null);
    setViewWeekStart((current) => {
      const next = new Date(current);
      next.setDate(current.getDate() + 7);
      return next;
    });
  }

  const [payrollYear, payrollMonthNumber] = payrollMonth.split("-").map(Number);
  const payrollOccurrences = [];
  const payrollOccurrenceKeys = new Set();
  function occurrenceFromRecord(record) {
    const student = students.find((item) => item.id === record.studentId) || {
      id: record.studentId,
      name: record.studentName,
      hourlyRate: record.hourlyRate,
    };
    return {
      key: record.key,
      date: new Date(`${record.date}T00:00:00`),
      session: {
        id: record.sessionId,
        studentId: record.studentId,
        start: record.start,
        duration: record.duration,
        note: record.note,
        details: record.details || "",
        _occurrenceNote: occurrenceNotes[`${record.date}|${record.sessionId}`] || "",
        studentPricing: { [record.studentId]: { mode: record.pricingMode || "hourly", amount: Number(record.unitPrice ?? record.hourlyRate) || 0 } },
      },
      student: { ...student, name: record.studentName, hourlyRate: Number(record.unitPrice ?? record.hourlyRate) || 0 },
      pricingMode: record.pricingMode || "hourly",
      unitPrice: Number(record.unitPrice ?? record.hourlyRate) || 0,
      status: record.status,
      amount: record.amount,
    };
  }
  if (payrollYear && payrollMonthNumber) {
    const daysInMonth = new Date(payrollYear, payrollMonthNumber, 0).getDate();
    for (let dayOfMonth = 1; dayOfMonth <= daysInMonth; dayOfMonth += 1) {
      const date = new Date(payrollYear, payrollMonthNumber - 1, dayOfMonth);
      const weekday = (date.getDay() + 6) % 7;
      const lessonDate = dateKey(date);
      const occurrenceWeekKey = weekKeyForDateString(lessonDate);
      const closingForDate = weeklyClosings[occurrenceWeekKey];
      const occurrenceDefaultVersionKey = Object.keys(defaultScheduleVersions).filter((key) => key <= occurrenceWeekKey).sort().pop();
      const occurrenceDefaultSessions = occurrenceDefaultVersionKey ? defaultScheduleVersions[occurrenceDefaultVersionKey] : sessions;
      const sessionsForDate = closingForDate?.sessionsSnapshot || weekOverrides[occurrenceWeekKey] || occurrenceDefaultSessions;
      const studentsForDate = closingForDate?.studentsSnapshot || students;
      sessionsForDate
        .filter((session) => session.day === weekday && lessonDate >= (session.effectiveFrom || "1970-01-01"))
        .forEach((session) => {
          session.studentIds.forEach((studentId) => {
            const key = `${lessonDate}|${session.id}|${studentId}`;
            payrollOccurrenceKeys.add(key);
            const storedRecord = lessonRecords[key];
            if (storedRecord) {
              payrollOccurrences.push(occurrenceFromRecord(storedRecord));
              return;
            }
            const student = studentsForDate.find((item) => item.id === studentId);
            const status = attendance[key] || "planned";
            const pricing = pricingForStudent(session, student);
            const amount = status === "completed" ? calculatedLessonFee(session, student) : 0;
            payrollOccurrences.push({
              key,
              date,
              session: { ...session, studentId, _occurrenceNote: occurrenceNotes[`${lessonDate}|${session.id}`] || "" },
              student: student ? { ...student, hourlyRate: pricing.amount } : null,
              pricingMode: pricing.mode,
              unitPrice: pricing.amount,
              status,
              amount,
            });
          });
        });
    }
    Object.values(lessonRecords).forEach((record) => {
      if (record.date.slice(0, 7) === payrollMonth && !payrollOccurrenceKeys.has(record.key)) {
        payrollOccurrences.push(occurrenceFromRecord(record));
        payrollOccurrenceKeys.add(record.key);
      }
    });
  }
  payrollOccurrences.sort((a, b) => a.date - b.date || a.session.start - b.session.start);
  const payrollStudents = new Map(students.map((student) => [student.id, student]));
  Object.values(lessonRecords).forEach((record) => {
    if (!payrollStudents.has(record.studentId)) {
      payrollStudents.set(record.studentId, { id: record.studentId, name: record.studentName, hourlyRate: record.hourlyRate });
    }
  });
  const payrollRows = Array.from(payrollStudents.values()).map((student) => {
    const rows = payrollOccurrences.filter((item) => item.student?.id === student.id && item.status === "completed");
    const rates = [...new Set(rows.map((item) => Number(item.student?.hourlyRate) || 0))];
    const priceDescriptions = [...new Set(rows.map((item) => `${item.pricingMode || "hourly"}|${Number(item.unitPrice ?? item.student?.hourlyRate) || 0}`))];
    const paymentKey = `${payrollMonth}|${student.id}`;
    return {
      student,
      paymentKey,
      paid: Boolean(tuitionPayments[paymentKey]),
      sessions: rows.length,
      minutes: rows.reduce((sum, item) => sum + item.session.duration, 0),
      amount: rows.reduce((sum, item) => sum + item.amount, 0),
      hourlyRate: rates.length === 1 ? rates[0] : null,
      priceDescription: priceDescriptions.length === 1 ? priceDescriptions[0] : null,
    };
  }).filter((row) => row.sessions > 0);
  function toggleTuitionPayment(row) {
    recordActivity(row.paid ? "payment.undo" : "payment.paid", row.paid
      ? (lang === "vi" ? `Đã hoàn tác thanh toán của ${row.student.name} tháng ${payrollMonth}` : `Undid payment for ${row.student.name} in ${payrollMonth}`)
      : (lang === "vi" ? `Đã thanh toán học phí của ${row.student.name} tháng ${payrollMonth}` : `Marked ${row.student.name} paid for ${payrollMonth}`),
      { month: payrollMonth, studentId: row.student.id, amount: row.amount });
    setTuitionPayments((previous) => {
      const next = { ...previous };
      if (next[row.paymentKey]) {
        delete next[row.paymentKey];
      } else {
        next[row.paymentKey] = {
          month: payrollMonth,
          studentId: row.student.id,
          studentName: row.student.name,
          amount: row.amount,
          paidAt: Date.now(),
        };
      }
      return next;
    });
  }
  const attendanceDetailRows = Array.from(payrollStudents.values()).map((student) => ({
    student,
    attended: payrollOccurrences.filter((item) => item.student?.id === student.id && item.status === "completed"),
    absent: payrollOccurrences.filter((item) => item.student?.id === student.id && item.status === "cancelled"),
  })).filter((row) => row.attended.length || row.absent.length);
  const payrollTotal = payrollRows.reduce((sum, row) => sum + row.amount, 0);

  if (!localHydrated) {
    return (
      <div className="w-full min-h-screen flex items-center justify-center" style={{ background: "#F3F5F7", color: "#6B7A99" }}>
        <div className="text-sm font-medium">{t.loadingData}</div>
      </div>
    );
  }

  return (
    <div
      className="w-full min-h-screen flex flex-col"
      style={{ background: "#F3F5F7", color: "#16213E" }}
    >
      <div className="px-6 pt-6 pb-4 flex items-center justify-between flex-wrap gap-3" style={{ background: "#1B2A4A" }}>
        <div>
          <h1 className="text-xl font-semibold tracking-tight" style={{ color: "#F3F5F7" }}>
            {t.title}
          </h1>
          <p className="text-sm mt-0.5" style={{ color: "#8FA0C2" }}>
            {t.subtitle}
          </p>
        </div>
        <div className="w-full flex flex-wrap items-center gap-2">
          <div className="flex items-center rounded-lg overflow-hidden" style={{ background: "#25365C", color: "#F3F5F7" }}>
            <button
              onClick={() => setViewWeekStart((current) => { const previous = new Date(current); previous.setDate(current.getDate() - 7); return previous; })}
              className="p-2 hover:opacity-70"
              title="Previous week"
            ><ChevronLeft size={16} /></button>
            <button
              onClick={() => setViewWeekStart(startOfWeek(new Date()))}
              className="px-2 text-xs font-medium hover:opacity-70 whitespace-nowrap"
            >{viewWeekKey.slice(5)} → {viewWeekEnd.slice(5)}</button>

              className="flex items-center gap-2 px-3 py-2.5 rounded-lg text-sm font-semibold whitespace-nowrap hover:opacity-90 transition disabled:opacity-60"

              <Users size={15} />

            <button
              onClick={() => setFilterId(null)}
              className="w-full text-left px-3 py-2 rounded-lg text-sm mb-1 transition"
              style={{
                background: filterId === null ? "#1B2A4A" : "transparent",
                color: filterId === null ? "#FFFFFF" : "#16213E",

            >
              {t.allStudents}
            </button>

            <div className="flex flex-col gap-1 mt-1">

                // Đếm theo lịch của tuần đang xem (activeSessionsForView), không dùng "sessions" gốc,
                // vì sau khi đã từng bấm "Đặt lịch mặc định" thì "sessions" không còn phản ánh lịch thật nữa.
                const count = activeSessionsForView.filter((x) => x.studentIds.includes(s.id)).length;
                const active = filterId === s.id;
                return (
                  <div
                    key={s.id}
                    className="flex items-center gap-2 px-3 py-2 rounded-lg text-sm cursor-pointer group"
                    style={{ background: active ? c.soft : "transparent" }}

                    {t.cancel}

                style={{ borderColor: "#B7C2D0", color: "#6B7A99" }}
              >
                <Plus size={14} /> {t.addStudent}
              </button>
            )}

        <div className="flex-1 flex flex-col min-w-0">
          <div ref={scrollRef} className="flex-1 overflow-y-auto" style={{ background: "#FFFFFF" }}>

              <div className="w-14 shrink-0" />
              <div className="flex-1 grid grid-cols-7">
                {t.dayLabels.map((d, i) => (
                  <div
                    key={d}
                    className="py-2.5 text-center text-sm font-medium border-l"
                    style={{
                      borderColor: "#DDE3E8",
                      color: isCurrentWeek && i === todayIndex ? "#1B2A4A" : "#6B7A99",
                      background: isCurrentWeek && i === todayIndex ? "#EAF0FF" : "transparent",
                    }}
                  >
                    <span className="hidden sm:inline">{d}</span>
                    <span className="sm:hidden">{t.dayShort[i]}</span>
                    <div className="text-[10px] font-mono mt-0.5 opacity-70">{String(viewWeekDates[i].getDate()).padStart(2, "0")}/{String(viewWeekDates[i].getMonth() + 1).padStart(2, "0")}</div>
                  </div>
                ))}
              </div>
            </div>

            <div className="flex" style={{ height: totalHeight }}>
              <div className="w-14 shrink-0 relative" style={{ color: "#8896AC" }}>

                  <div
                    key={h}
                    className="absolute right-2 text-[15px] font-mono"
                    style={{ top: (h - START_HOUR) * rowHeight - 6 }}
                  >
                    {String(h).padStart(2, "0")}:00
                  </div>
                ))}
              </div>

              <div ref={gridRef} className="flex-1 grid grid-cols-7 relative">
                {Array.from({ length: 7 }, (_, dayIndex) => (
                  <div
                    key={dayIndex}
                    className="relative border-l cursor-crosshair"
                    style={{
                      borderColor: "#DDE3E8",
                      background: `${isCurrentWeek && dayIndex === todayIndex ? "#FBFCFE " : "#FFFFFF "}repeating-linear-gradient(
                        to bottom,
                        transparent 0,
                        transparent ${rowHeight - 1}px,
                        #EBEEF1 ${rowHeight - 1}px,
                        #EBEEF1 ${rowHeight}px
                      )`,
                    }}
                    onClick={(e) => onColumnClick(e, dayIndex)}
                  >
                    {isCurrentWeek && dayIndex === todayIndex && nowMinutes >= START_MIN && nowMinutes <= END_MIN && (
                      <div
                        className="absolute left-0 right-0 flex items-center pointer-events-none z-10"
                        style={{ top: ((nowMinutes - START_MIN) / 60) * rowHeight }}
                      >
                        <span className="w-1.5 h-1.5 rounded-full -ml-0.5" style={{ background: "#FF6B4A" }} />
                        <span className="flex-1 h-px" style={{ background: "#FF6B4A" }} />
                      </div>
                    )}

                    {visibleSessions
                      .filter((s) => s.day === dayIndex)
                      .map((s) => {
                        const members = s._members || s.studentIds.map(scheduleStudentById).filter(Boolean);
                        const student = members[0];
                        const c = colorFor(student);
                        const top = ((s.start - START_MIN) / 60) * rowHeight;
                        const height = Math.max((s.duration / 60) * rowHeight, 18);
                        const compact = height < 34;
                        const occurrenceKey = currentWeekOccurrenceKey(s);
                        const memberStatuses = Object.fromEntries(
                          members.map((member) => {
                            const memberKey = `${occurrenceKey}|${member.id}`;
                            return [member.id, lessonRecords[memberKey]?.status || attendance[memberKey] || "planned"];
                          })
                        );
                        const completedCount = Object.values(memberStatuses).filter((status) => status === "completed").length;
                        const cancelledCount = Object.values(memberStatuses).filter((status) => status === "cancelled").length;
                        const taught = members.length > 0 && completedCount === members.length;
                        const allCancelled = members.length > 0 && cancelledCount === members.length;
                        const partialAttendance = members.length > 1 && new Set(Object.values(memberStatuses)).size > 1;
                        return (
                          <div
                            key={s.id}
                            title={[s.note, s.details].filter(Boolean).join(" — ")}
                            onMouseDown={(e) => !s._historical && onSessionMouseDown(e, s)}
                            onClick={(e) => e.stopPropagation()}
                            onDoubleClick={(e) => {
                              e.stopPropagation();
                              if (!viewedWeekClosing && !suppressSessionEditRef.current) {
                                if (s._historical) openHistoricalModal(s);
                                else openEditModal(s);
                              }
                            }}
                            className={`absolute rounded-md ${partialAttendance ? "pl-6" : "pl-1.5"} pr-7 overflow-hidden select-none shadow-sm ${compact ? "py-0.5" : "py-1"}`}
                            style={{
                              ...overlapStyleFor(s),
                              top,
                              height,
                              backgroundColor: c.bg,
                              backgroundImage: "none",
                              border: "1px solid transparent",
                              color: "#fff",
                              opacity: 1,
                              cursor: viewedWeekClosing ? "default" : (s._historical ? "pointer" : "grab"),
                              zIndex: 5,
                            }}
                          >
                            {allCancelled && (
                              <div
                                className="absolute left-1 right-1 top-1/2 h-0.5 -translate-y-1/2 pointer-events-none z-20 rounded"
                                style={{ background: "rgba(255,255,255,0.95)" }}
                                title={t.cancelledClassIndicator}
                                aria-label={t.cancelledClassIndicator}
                              />
                            )}
                            {partialAttendance && (
                              <div
                                className={`absolute left-1 rounded-full flex items-center justify-center text-[11px] font-bold pointer-events-none z-20 ${compact ? "top-1/2 -translate-y-1/2 w-4 h-4" : "top-1 w-4 h-4"}`}
                                style={{ background: "#F59F00", color: "#FFFFFF" }}
                                title={t.partialAttendanceIndicator}
                                aria-label={t.partialAttendanceIndicator}
                              >
                                !
                              </div>
                            )}
                            <button
                              type="button"
                              disabled={Boolean(viewedWeekClosing)}
                              className={`absolute right-1 rounded flex items-center justify-center cursor-pointer ${compact ? "top-1/2 -translate-y-1/2 w-4 h-4" : "top-1 w-5 h-5"}`}
                              style={{ background: taught ? "#FFFFFF" : "rgba(255,255,255,0.88)", opacity: viewedWeekClosing ? 0.55 : 1, cursor: viewedWeekClosing ? "not-allowed" : "pointer" }}
                              title={t.markTaught}
                              onMouseDown={(e) => e.stopPropagation()}
                              onClick={(e) => {
                              e.stopPropagation();
                              if (viewedWeekClosing) return;

                              if (quickAttendance) {
                                // Chế độ điểm danh nhanh: mỗi lần bấm chỉ tích/bỏ tích ngay
                                // cho tất cả học sinh trong lớp, không mở bảng chỉnh sửa.
                                const nextStatus = taught ? "planned" : "completed";
                                members.forEach((member) => {
                                  updateLessonStatus(
                                    `${occurrenceKey}|${member.id}`,
                                    { ...(s._historical ? { ...s, id: s._sourceSessionId } : s), studentId: member.id },
                                    member,
                                    nextStatus
                                  );
                                });
                                return;
                              }

                              const hasAttendanceData = members.some((member) => {
                                const memberKey = `${occurrenceKey}|${member.id}`;

                                return (
                                  lessonRecords[memberKey]?.status != null ||
                                  attendance[memberKey] != null
                                );
                              });

                              // Chưa có dữ liệu: đánh dấu tất cả là đã dạy ngay.
                              if (!hasAttendanceData) {
                                members.forEach((member) => {
                                  updateLessonStatus(
                                    `${occurrenceKey}|${member.id}`,
                                    { ...(s._historical ? { ...s, id: s._sourceSessionId } : s), studentId: member.id },
                                    member,
                                    "completed"
                                  );
                                });

                                return;
                              }

                              // Đã có dữ liệu: mở hộp thoại để xem hoặc chỉnh sửa.
                              setAttendanceConfirm({
                                key: occurrenceKey,
                                session: s._historical ? { ...s, id: s._sourceSessionId } : s,
                                members,
                                statuses: memberStatuses,
                                originalStatuses: { ...memberStatuses },
                              });
                            }}
                            >
                              <input
                                type="checkbox"
                                checked={taught}
                                readOnly
                                tabIndex="-1"
                                className="pointer-events-none w-3.5 h-3.5 accent-emerald-600"
                                aria-label={t.markTaught}
                              />
                            </button>
                            <div className="text-[11px] font-semibold leading-tight truncate" style={{ textDecoration: allCancelled ? "line-through" : "none" }}>
                              {s.note || (members.length === 1 ? members[0]?.name : `${members.length} ${t.students.toLowerCase()}`)}
                            </div>
                            {!compact && (
                              <div className="text-[10px] leading-tight opacity-90 font-mono truncate">
                                {fmtTime(s.start)}–{fmtTime(s.start + s.duration)}
                              </div>
                            )}
                            {!compact && (
                              <div className="text-[10px] leading-tight opacity-80 truncate">
                                {members.length === 1 ? members[0]?.name : `${completedCount}/${members.length} ${t.completed.toLowerCase()}`}
                              </div>
                            )}
                            {!compact && s._occurrenceNote && (
                              <div className="text-[10px] leading-tight mt-0.5 truncate font-medium" title={s._occurrenceNote}>
                                📝 {s._occurrenceNote}
                              </div>
                            )}
                            {!s._historical && (
                              <div
                                onMouseDown={(e) => onResizeMouseDown(e, s)}
                                className="absolute bottom-0 left-0 right-0 h-1.5 cursor-ns-resize"
                              />
                            )}
                          </div>
                        );
                      })}
                  </div>
                ))}
              </div>
            </div>
          </div>
        </div>
      </div>

      {modal && (
        <div
          className="fixed inset-0 flex items-center justify-center z-50 p-4"
          style={{ background: "rgba(27,42,74,0.45)" }}
          onClick={() => setModal(null)}
        >
          <div
            className="w-full max-w-lg rounded-xl p-5 shadow-xl overflow-y-auto"
            style={{ background: "#FFFFFF", maxHeight: "90vh" }}
            onClick={(e) => e.stopPropagation()}
          >
            <div className="flex items-center justify-between mb-4">
              <h2 className="text-base font-semibold">
                {modal.mode === "add" ? t.addSession : t.editSession}
              </h2>
              <button onClick={() => setModal(null)} style={{ color: "#6B7A99" }}>
                <X size={18} />
              </button>
            </div>

            {modal.error && (
              <div className="text-xs px-3 py-2 rounded-lg mb-3" style={{ background: "#FFECEC", color: "#E03131" }}>{modal.error}</div>
            )}
            <div className="flex flex-col gap-3">
              <div>
                <label className="text-xs font-medium" style={{ color: "#6B7A99" }}>
                  {t.classMembers}
                </label>
                <div className="flex flex-wrap gap-1.5 mt-1.5">
                  {students.map((s) => {
                    const c = colorFor(s);
                    const active = modal.studentIds?.includes(s.id);
                    return (
                      <button
                        key={s.id}
                        disabled={modal.mode === "history"}
                        onClick={() => {
                          if (modal.mode === "history") return;
                          const studentIds = active
                            ? modal.studentIds.filter((id) => id !== s.id)
                            : [...(modal.studentIds || []), s.id];
                          const studentRates = { ...(modal.studentRates || {}) };
                          const studentPricing = { ...(modal.studentPricing || {}) };
                          if (active) {
                            delete studentRates[s.id];
                            delete studentPricing[s.id];
                          } else {
                            studentRates[s.id] = Number(s.hourlyRate) || 0;
                            studentPricing[s.id] = { mode: "hourly", amount: Number(s.hourlyRate) || 0 };
                          }
                          setModal({ ...modal, studentIds, studentRates, studentPricing, studentId: studentIds[0] || null });
                        }}
                        className="flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg text-xs border"
                        style={{
