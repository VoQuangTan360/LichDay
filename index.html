                              onClick={() => toggleTuitionPayment(row)}
                              title={row.paid ? t.undoPayment : t.markPaid}
                              className="inline-flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg text-xs font-medium whitespace-nowrap border"
                              style={{
                                background: row.paid ? "#E4FBF3" : "#FFFFFF",
                                borderColor: row.paid ? "#12B886" : "#B7C2D0",
                                color: row.paid ? "#087F5B" : "#6B7A99",
                              }}
                            >
                              {row.paid && <Check size={13} />}
                              {row.paid ? t.paid : t.markPaid}
                            </button>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              )}

              {attendanceDetailRows.length > 0 && (
                <div className="mb-5">
                  <h3 className="text-sm font-semibold mb-2">{t.attendanceDetails}</h3>
                  <div className="grid grid-cols-1 lg:grid-cols-2 gap-2">
                    {attendanceDetailRows.map((row) => (
                      <div key={row.student.id} className="border rounded-lg p-3" style={{ borderColor: "#DDE3E8" }}>
                        <div className="text-sm font-semibold mb-2">{row.student.name}</div>
                        <div className="flex items-center justify-between gap-3 text-xs mb-1" style={{ color: "#087F5B" }}>
                          <span>{t.attendedDates}: {row.attended.length || 0}</span>
                          <span className="shrink-0">{t.totalAmount}</span>
                        </div>
                        {row.attended.map((item) => (
                          <div key={`attended-${item.key}`} className="flex justify-between items-baseline gap-3 text-xs ml-2 mb-0.5">
                            <span className="min-w-0 break-words">{item.date.toLocaleDateString(lang === "vi" ? "vi-VN" : "en-US")} · {fmtTime(item.session.start)}–{fmtTime(item.session.start + item.session.duration)} · {item.session.note || "—"}</span>
                            <span className="shrink-0 whitespace-nowrap font-semibold tabular-nums" style={{ color: "#087F5B" }}>{formatMoney(item.amount, lang)}</span>
                          </div>
                        ))}
                        <div className="text-xs mt-2 mb-1" style={{ color: "#E03131" }}>{t.absentDates}: {row.absent.length || 0}</div>
                        {row.absent.map((item) => (
                          <div key={`absent-${item.key}`} className="flex justify-between items-baseline gap-3 text-xs ml-2 mb-0.5">
                            <span className="min-w-0 break-words">{item.date.toLocaleDateString(lang === "vi" ? "vi-VN" : "en-US")} · {fmtTime(item.session.start)}–{fmtTime(item.session.start + item.session.duration)} · {item.session.note || "—"}</span>
                            <span className="shrink-0 whitespace-nowrap font-semibold tabular-nums" style={{ color: "#6B7A99" }}>{formatMoney(item.amount, lang)}</span>
                          </div>
                        ))}
                      </div>
                    ))}
                  </div>
                </div>
              )}

              <div className="flex flex-col gap-2">
                {payrollOccurrences.length === 0 && <div className="text-sm text-center py-8" style={{ color: "#6B7A99" }}>{t.noLessons}</div>}
                {payrollOccurrences.map((item) => (
                  <div key={item.key} className="border rounded-lg p-3 flex flex-col sm:flex-row sm:items-center gap-3" style={{ borderColor: "#DDE3E8" }}>
                    <div className="sm:w-36 shrink-0">
                      <div className="text-sm font-semibold">{item.date.toLocaleDateString(lang === "vi" ? "vi-VN" : "en-US")}</div>
                      <div className="text-xs font-mono" style={{ color: "#6B7A99" }}>{fmtTime(item.session.start)}–{fmtTime(item.session.start + item.session.duration)}</div>
                    </div>
                    <div className="flex-1 min-w-0">
                      <div className="text-sm font-medium truncate">{item.student?.name || "?"}</div>
                      <div className="text-xs truncate" style={{ color: "#6B7A99" }}>{item.session.note || `${item.session.duration} ${lang === "vi" ? "phút" : "min"}`} · {formatMoney(calculatedLessonFee(item.session, item.student), lang)}</div>
                      {item.session.details && <div className="text-xs mt-1" style={{ color: "#8896AC" }}>{item.session.details}</div>}
                      {item.session._occurrenceNote && <div className="text-xs mt-1 font-medium" style={{ color: "#A65F00" }}>📝 {item.session._occurrenceNote}</div>}
                    </div>
                    <div className="flex gap-1.5 shrink-0">
                      {[
                        ["completed", t.completed, "#12B886", "#E4FBF3"],
                        ["planned", t.planned, "#6B7A99", "#F3F5F7"],
                        ["cancelled", t.cancelled, "#E03131", "#FFECEC"],
                      ].map(([status, label, color, soft]) => (
                        <button
                          key={status}
                          disabled={Boolean(weeklyClosings[weekKeyForDateString(dateKey(item.date))])}
                          onClick={() => updateLessonStatus(item.key, item.session, item.student, status)}
                          className="px-2.5 py-1.5 rounded-md text-xs font-medium flex items-center gap-1"
                          style={{
                            background: item.status === status ? color : soft,
                            color: item.status === status ? "#FFFFFF" : color,
                            opacity: weeklyClosings[weekKeyForDateString(dateKey(item.date))] ? 0.5 : 1,
                            cursor: weeklyClosings[weekKeyForDateString(dateKey(item.date))] ? "not-allowed" : "pointer",
                          }}
                        >
                          {status === "completed" && <Check size={12} />} {label}
                        </button>
                      ))}
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </div>
        </div>
      )}

      {activityLogOpen && (
        <div className="fixed inset-0 flex items-center justify-center z-50 p-4" style={{ background: "rgba(27,42,74,0.5)" }} onClick={() => setActivityLogOpen(false)}>
          <div className="w-full max-w-2xl rounded-xl shadow-xl overflow-hidden" style={{ background: "#FFFFFF", maxHeight: "88vh" }} onClick={(e) => e.stopPropagation()}>
            <div className="p-4 border-b flex items-center justify-between gap-3" style={{ borderColor: "#DDE3E8" }}>
              <h2 className="text-base font-semibold flex items-center gap-2"><History size={17} /> {t.activityLog}</h2>
              <div className="flex items-center gap-2">
                {activityLogs.length > 0 && <button onClick={() => { if (window.confirm(t.clearLogConfirm)) setActivityLogs([]); }} className="px-2.5 py-1.5 rounded-lg text-xs" style={{ background: "#FFECEC", color: "#E03131" }}>{t.clearLog}</button>}
                <button onClick={() => setActivityLogOpen(false)} style={{ color: "#6B7A99" }}><X size={18} /></button>
              </div>
            </div>
            <div className="overflow-y-auto p-4" style={{ maxHeight: "calc(88vh - 65px)" }}>
              {activityLogs.length === 0 && <div className="text-sm text-center py-8" style={{ color: "#6B7A99" }}>{t.noActivity}</div>}
              <div className="flex flex-col gap-2">
                {activityLogs.map((entry) => (
                  <div key={entry.id} className="rounded-lg border p-3" style={{ borderColor: "#DDE3E8" }}>
                    <div className="flex items-start justify-between gap-3">
                      <div className="text-sm font-medium">{entry.message}</div>
                      <div className="text-[11px] whitespace-nowrap" style={{ color: "#8896AC" }}>{new Date(entry.at).toLocaleString(lang === "vi" ? "vi-VN" : "en-US")}</div>
                    </div>
                    <div className="text-[11px] mt-1 font-mono" style={{ color: "#6B7A99" }}>{entry.type}</div>
                  </div>
                ))}
              </div>
            </div>
          </div>
        </div>
      )}

      {syncModalOpen && (
        <div
          className="fixed inset-0 flex items-center justify-center z-50 p-4"
          style={{ background: "rgba(27,42,74,0.45)" }}
          onClick={() => setSyncModalOpen(false)}
        >
          <div
            className="w-full max-w-lg rounded-xl p-5 shadow-xl overflow-y-auto"
            style={{ background: "#FFFFFF", maxHeight: "92vh" }}
            onClick={(e) => e.stopPropagation()}
          >
            <div className="flex items-center justify-between mb-3">
              <h2 className="text-base font-semibold flex items-center gap-1.5">
                <Cloud size={16} /> {t.syncTitle}
              </h2>
              <button onClick={() => setSyncModalOpen(false)} style={{ color: "#6B7A99" }}>
                <X size={18} />
              </button>
            </div>

            <p className="text-xs mb-3" style={{ color: "#6B7A99" }}>
              {t.syncIntro}
            </p>

            <section className="rounded-lg border p-3 mb-4" style={{ borderColor: syncErrors.length ? "#F5C2A0" : "#DDE3E8", background: syncErrors.length ? "#FFF9F2" : "#FBFCFE" }}>
              <div className="flex items-center justify-between gap-2 mb-2">
                <h3 className="text-sm font-semibold">{lang === "vi" ? "Lỗi đồng bộ gần đây" : "Recent sync errors"}</h3>
                {syncErrors.length > 0 && <button onClick={copySyncErrors} className="text-xs px-2 py-1 rounded border" style={{ borderColor: "#DDE3E8", background: "#FFFFFF" }}>{lang === "vi" ? "Sao chép lỗi" : "Copy errors"}</button>}
              </div>
              <p className="text-xs mb-2" style={{ color: "#6B7A99" }}>{lang === "vi" ? "Giữ 10 lỗi gần nhất trên máy này; lịch sử lỗi vẫn còn sau khi đồng bộ thành công." : "The last 10 errors are stored on this device, including after successful sync."}</p>
              {syncErrors.length === 0 && <div className="text-xs" style={{ color: "#6B7A99" }}>{lang === "vi" ? "Chưa ghi nhận lỗi đồng bộ." : "No sync errors recorded."}</div>}
              {syncErrorCopyFeedback && <div role="status" className="text-xs mb-2">{syncErrorCopyFeedback}</div>}
              <div className="max-h-64 overflow-y-auto space-y-2">
                {syncErrors.map((entry, index) => (
                  <details key={entry.id} open={index === 0} className="rounded border p-2 text-xs" style={{ borderColor: "#E8D6C7", background: "#FFFFFF" }}>
                    <summary className="cursor-pointer break-words">
                      <span className="font-semibold">{syncErrorOperation(entry.operation)}</span> · {new Date(entry.at).toLocaleString(lang === "vi" ? "vi-VN" : "en-US")}
                      {entry.count > 1 && <span> · {entry.count} {lang === "vi" ? "lần" : "times"}</span>}
                    </summary>
                    <div className="mt-2" style={{ color: "#A65F00" }}>{syncErrorExplanation(entry, lang)}</div>
                    <div className="mt-1 break-all font-mono">{entry.code}</div>
                    <pre className="mt-1 whitespace-pre-wrap break-words select-text font-mono" style={{ overflowWrap: "anywhere", color: "#6B7A99" }}>{entry.message}</pre>
                  </details>
                ))}
              </div>
            </section>

            <div className="rounded-lg border p-3 mb-4" style={{ borderColor: "#DDE3E8", background: "#FBFCFE" }}>
              <div className="text-sm font-semibold mb-1">{t.localBackup}</div>
              <div className="text-xs mb-3" style={{ color: "#087F5B" }}>{t.localPrimary}</div>
              <div className="text-xs mb-3" style={{ color: localSaveStatus === "error" ? "#E03131" : "#6B7A99" }}>
                {localSaveStatus === "saving" ? t.localSaving : localSaveStatus === "error" ? t.localSaveError : t.localSaved}
                {localSaveStatus === "saved" && lastLocalSavedAt ? ` · ${new Date(lastLocalSavedAt).toLocaleTimeString(lang === "vi" ? "vi-VN" : "en-US")}` : ""}
              </div>
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                <button onClick={exportLocalBackup} className="px-3 py-2 rounded-lg text-sm" style={{ background: "#1B2A4A", color: "#FFFFFF" }}>{t.exportBackup}</button>
                <button onClick={() => importBackupRef.current?.click()} className="px-3 py-2 rounded-lg text-sm" style={{ background: "#F3F5F7" }}>{t.importBackup}</button>
                <input ref={importBackupRef} type="file" accept="application/json,.json" onChange={previewImportedBackup} className="hidden" />
              </div>
              <div className="text-xs font-medium mt-3 mb-1.5" style={{ color: "#6B7A99" }}>{t.recentSnapshots}</div>
              {localSnapshots.length === 0 && <div className="text-xs" style={{ color: "#8896AC" }}>{t.noSnapshots}</div>}
              <div className="flex flex-col gap-1.5">
                {localSnapshots.slice(0, 5).map((snapshot) => (
                  <div key={snapshot.id} className="flex items-center gap-2 rounded-md px-2 py-1.5" style={{ background: "#FFFFFF" }}>
                    <div className="flex-1 min-w-0 text-xs">
                      <div>{new Date(snapshot.savedAt).toLocaleString(lang === "vi" ? "vi-VN" : "en-US")}</div>
                      <div style={{ color: "#8896AC" }}>{snapshot.summary.students} {t.students.toLowerCase()} · {snapshot.summary.lessons} {lang === "vi" ? "bản ghi" : "records"}</div>
                    </div>
                    <button onClick={() => restoreLocalSnapshot(snapshot)} className="px-2 py-1 rounded text-xs" style={{ background: "#FFF4E0", color: "#A65F00" }}>{t.restoreBackup}</button>
                  </div>
                ))}
              </div>
            </div>

            {backupPreview && (
              <div className="rounded-lg border p-3 mb-4" style={{ borderColor: "#F59F00", background: "#FFF9E6" }}>
                <div className="text-sm font-semibold mb-2">{t.backupPreview}</div>
                <div className="text-xs mb-3" style={{ color: "#6B7A99" }}>
                  {backupPreview.summary.students} {t.students.toLowerCase()} · {backupPreview.summary.sessions} {lang === "vi" ? "lớp" : "classes"} · {backupPreview.summary.lessons} {lang === "vi" ? "bản ghi" : "records"}
                </div>
                <div className="flex gap-2 justify-end">
                  <button onClick={() => setBackupPreview(null)} className="px-3 py-1.5 rounded-lg text-sm" style={{ background: "#FFFFFF" }}>{t.cancel}</button>
                  <button onClick={restorePreviewedBackup} className="px-3 py-1.5 rounded-lg text-sm text-white" style={{ background: "#F59F00" }}>{t.restoreBackup}</button>
                </div>
              </div>
            )}

            {backupFeedback && <div className="text-xs px-3 py-2 rounded-lg mb-3" style={{ background: backupFeedback === t.cloudConflict || backupFeedback === t.backupInvalid ? "#FFF4E0" : "#E4FBF3", color: backupFeedback === t.cloudConflict || backupFeedback === t.backupInvalid ? "#A65F00" : "#087F5B" }}>{backupFeedback}</div>}

            {syncCfg ? (
              <div className="flex flex-col gap-3">
                <div className="text-sm font-semibold">{t.firebaseBackup}</div>
                <div
                  className="rounded-lg px-3 py-2 text-xs"
                  style={{
                    background: autoBackupStatus === "conflict" ? "#FFF4E0" : autoBackupStatus === "offline" ? "#FFECEC" : "#E4FBF3",
                    color: autoBackupStatus === "conflict" ? "#A65F00" : autoBackupStatus === "offline" ? "#E03131" : "#087F5B",
                  }}
                >
                  <span className="font-semibold">{t.autoBackupTitle}: </span>
                  {{
                    idle: t.autoBackupIdle,
                    pending: t.autoBackupPending,
                    saving: t.autoBackupSaving,
                    saved: t.autoBackupSaved,
                    offline: t.autoBackupOffline,
                    conflict: t.autoBackupConflict,
                  }[autoBackupStatus] || t.autoBackupIdle}
                  {lastCloudSavedAt && autoBackupStatus === "saved" ? ` · ${new Date(lastCloudSavedAt).toLocaleString(lang === "vi" ? "vi-VN" : "en-US")}` : ""}
                </div>
                <div>
                  <label className="text-xs font-medium" style={{ color: "#6B7A99" }}>
                    {t.syncedAs}
                  </label>
                  <div
                    className="mt-1.5 px-3 py-2 rounded-lg text-sm font-mono"
                    style={{ background: "#F3F5F7" }}
                  >
                    {syncCfg.syncCode}
                  </div>
                </div>
                <div className="grid grid-cols-1 gap-2">
                  <button onClick={checkFirebaseBackup} className="px-3 py-2 rounded-lg text-sm" style={{ background: "#F3F5F7" }}>{t.checkCloud}</button>
                </div>
                {cloudBackups.length > 0 && (
                  <div>
                    <div className="text-xs font-medium mb-1.5" style={{ color: "#6B7A99" }}>{t.recentCloudBackups}</div>
                    <div className="flex flex-col gap-2">
                      {cloudBackups.slice(0, 10).map((backup) => (
                        <div key={backup.versionId || backup.revision} className="rounded-lg p-3 text-xs" style={{ background: "#F3F5F7", color: "#6B7A99" }}>
                          <div>Revision {backup.revision} · {new Date(backup.updatedAt).toLocaleString(lang === "vi" ? "vi-VN" : "en-US")}</div>
                          <div className="mt-1">{backup.summary?.students || 0} {t.students.toLowerCase()} · {backup.summary?.sessions || 0} {lang === "vi" ? "lớp" : "classes"} · {backup.summary?.lessons || 0} {lang === "vi" ? "bản ghi" : "records"}</div>
                          <button onClick={() => restoreFirebaseBackup(backup)} className="mt-2 px-3 py-1.5 rounded-lg text-sm" style={{ background: "#FFF4E0", color: "#A65F00" }}>{t.restoreCloud}</button>
                        </div>
                      ))}
                    </div>
                  </div>
                )}
                <button onClick={copySyncLink} className="px-3 py-2 rounded-lg text-sm" style={{ background: "#F3F5F7" }}>{t.copyLink}</button>
                {copyFeedback && (
                  <div className="text-xs break-all" style={{ color: "#6B7A99" }}>
                    {copyFeedback}
                  </div>
                )}
                <p className="text-xs" style={{ color: "#6B7A99" }}>
                  {t.syncHelp}
                </p>
                <button
                  onClick={disconnectSync}
                  className="px-3 py-2 rounded-lg text-sm"
                  style={{ background: "#FFECEC", color: "#E03131" }}
                >
                  {t.disconnect}
                </button>
              </div>
            ) : (
              <div className="flex flex-col gap-3">
                <div>
                  <label className="text-xs font-medium" style={{ color: "#6B7A99" }}>
                    {t.syncConfigLabel}
                  </label>
                  <textarea
                    value={syncConfigText}
                    onChange={(e) => setSyncConfigText(e.target.value)}
                    placeholder={t.syncConfigPlaceholder}
                    rows={6}
                    className="w-full mt-1.5 px-3 py-2 rounded-lg text-xs font-mono border outline-none"
                    style={{ borderColor: "#DDE3E8" }}
                  />
                </div>
                <div>
                  <label className="text-xs font-medium" style={{ color: "#6B7A99" }}>
                    {t.syncCodeLabel}
                  </label>
                  <input
                    value={syncCodeInput}
                    onChange={(e) => setSyncCodeInput(e.target.value)}
                    placeholder={t.syncCodePlaceholder}
                    className="w-full mt-1.5 px-3 py-2 rounded-lg text-sm border outline-none"
                    style={{ borderColor: "#DDE3E8" }}
                  />
                </div>
                {syncInputError && (
                  <div className="text-xs px-3 py-2 rounded-lg" style={{ background: "#FFECEC", color: "#E03131" }}>
                    {syncInputError}
                  </div>
                )}
                <button
                  onClick={connectSync}
                  className="px-3 py-2 rounded-lg text-sm text-white font-medium"
                  style={{ background: "#1B2A4A" }}
                >
                  {t.connect}
                </button>
              </div>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
